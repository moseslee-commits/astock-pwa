<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="智能选股">
<meta name="theme-color" content="#0e1217">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>我的 - A股智能选股</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
    --bg: #0e1217; --card: #1a1f2e; --card-hover: #222838; --border: #2a3142;
    --text: #e0e6ed; --text-sec: #8b95a7; --accent: #6366f1; --accent-light: rgba(99,102,241,0.15);
    --up: #ff4d4f; --down: #52c41a; --warn: #faad14;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
}
html, body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    font-size: 15px; overflow-x: hidden; min-height: 100vh;
}
body { padding-bottom: calc(70px + var(--safe-bottom)); }

/* 顶部 */
.header {
    padding: calc(20px + var(--safe-top)) 20px 16px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
}
.header-title { font-size: 22px; font-weight: 700; color: #fff; }
.header-sub { font-size: 13px; color: rgba(255,255,255,0.8); margin-top: 4px; }

/* 数据概览 */
.stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    padding: 16px; margin-top: -20px;
}
.stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 10px; text-align: center;
}
.stat-card .val { font-size: 20px; font-weight: 700; font-family: Consolas, monospace; }
.stat-card .lbl { font-size: 11px; color: var(--text-sec); margin-top: 4px; }

/* 功能列表 */
.section { padding: 0 16px; margin-bottom: 16px; }
.section-title { font-size: 13px; color: var(--text-sec); font-weight: 600; margin: 20px 0 10px; padding-left: 4px; }
.menu-list {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden;
}
.menu-item {
    display: flex; align-items: center; padding: 14px 16px;
    border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
    text-decoration: none; color: var(--text);
}
.menu-item:last-child { border-bottom: none; }
.menu-item:active { background: var(--card-hover); }
.menu-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    margin-right: 14px; flex-shrink: 0;
}
.menu-info { flex: 1; }
.menu-name { font-size: 15px; font-weight: 600; }
.menu-desc { font-size: 11px; color: var(--text-sec); margin-top: 2px; }
.menu-arrow { color: var(--text-sec); font-size: 16px; }

/* 底部导航 - 4项 */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(26,31,46,0.95); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around;
    padding: 8px 0 calc(8px + var(--safe-bottom));
    z-index: 1000;
}
.nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 20px; cursor: pointer; color: var(--text-sec);
    transition: color 0.2s; text-decoration: none; min-width: 60px;
}
.nav-item.active { color: var(--accent); }
.nav-item .icon { font-size: 22px; }
.nav-item .label { font-size: 10px; font-weight: 600; }

/* Toast */
.toast-container { position: fixed; top: calc(60px + var(--safe-top)); left: 50%; transform: translateX(-50%); z-index: 2000; }
.toast { padding: 10px 20px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); font-size: 13px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="header">
    <div class="header-title">我的</div>
    <div class="header-sub">A股智能选股系统 · 五维共振策略</div>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="val" style="color:var(--accent)" id="favCount">--</div>
        <div class="lbl">自选股</div>
    </div>
    <div class="stat-card">
        <div class="val" style="color:var(--warn)" id="alertCount">--</div>
        <div class="lbl">预警中</div>
    </div>
    <div class="stat-card">
        <div class="val" style="color:var(--down)" id="posCount">--</div>
        <div class="lbl">持仓</div>
    </div>
</div>

<div class="section">
    <div class="section-title">投资工具</div>
    <div class="menu-list">
        <a class="menu-item" href="./price-alert.html">
            <div class="menu-icon" style="background:rgba(255,77,79,0.15)">🔔</div>
            <div class="menu-info">
                <div class="menu-name">价格预警</div>
                <div class="menu-desc">突破/跌破预警，实时提醒</div>
            </div>
            <div class="menu-arrow">›</div>
        </a>
        <a class="menu-item" href="./history.html">
            <div class="menu-icon" style="background:rgba(139,92,246,0.15)">📋</div>
            <div class="menu-info">
                <div class="menu-name">选股历史</div>
                <div class="menu-desc">历史选股记录回溯与统计</div>
            </div>
            <div class="menu-arrow">›</div>
        </a>
        <a class="menu-item" href="./strategy-comparison.html">
            <div class="menu-icon" style="background:rgba(82,196,26,0.15)">📈</div>
            <div class="menu-info">
                <div class="menu-name">策略回测</div>
                <div class="menu-desc">四策略资金曲线对比与业绩</div>
            </div>
            <div class="menu-arrow">›</div>
        </a>
        <a class="menu-item" href="./parameter-sensitivity.html">
            <div class="menu-icon" style="background:rgba(250,173,20,0.15)">⚙️</div>
            <div class="menu-info">
                <div class="menu-name">参数分析</div>
                <div class="menu-desc">策略参数敏感性分析</div>
            </div>
            <div class="menu-arrow">›</div>
        </a>
    </div>
</div>

<div class="section">
    <div class="section-title">系统</div>
    <div class="menu-list">
        <div class="menu-item" onclick="clearCache()">
            <div class="menu-icon" style="background:rgba(139,149,167,0.15)">🗑️</div>
            <div class="menu-info">
                <div class="menu-name">清除缓存</div>
                <div class="menu-desc">清除离线缓存数据</div>
            </div>
            <div class="menu-arrow">›</div>
        </div>
        <div class="menu-item" onclick="showAbout()">
            <div class="menu-icon" style="background:rgba(99,102,241,0.15)">ℹ️</div>
            <div class="menu-info">
                <div class="menu-name">关于</div>
                <div class="menu-desc">版本 v2.0 · 五维共振选股</div>
            </div>
            <div class="menu-arrow">›</div>
        </div>
    </div>
</div>

<!-- 底部导航 4项 -->
<div class="bottom-nav">
    <a class="nav-item" href="./dashboard.html">
        <span class="icon">📊</span><span class="label">看板</span>
    </a>
    <a class="nav-item" href="./stock-picker.html">
        <span class="icon">🎯</span><span class="label">选股</span>
    </a>
    <a class="nav-item" href="./portfolio.html">
        <span class="icon">💼</span><span class="label">持仓</span>
    </a>
    <a class="nav-item active" href="./mobile.html">
        <span class="icon">👤</span><span class="label">我的</span>
    </a>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// 加载统计数据
function loadStats() {
    const favs = JSON.parse(localStorage.getItem('astock_favorites') || '[]');
    document.getElementById('favCount').textContent = favs.length;
    
    const alerts = JSON.parse(localStorage.getItem('astock_price_alerts') || '[]');
    document.getElementById('alertCount').textContent = alerts.filter(a => a.enabled !== false).length;
    
    const positions = JSON.parse(localStorage.getItem('astock_positions') || '[]');
    document.getElementById('posCount').textContent = positions.length;
}
loadStats();

function clearCache() {
    if (confirm('确定清除所有缓存数据？')) {
        if (caches) { caches.keys().then(keys => keys.forEach(k => caches.delete(k))); }
        showToast('缓存已清除');
    }
}

function showAbout() {
    showToast('A股智能选股系统 v2.0\n五维共振策略 · 81只龙头股');
}

function showToast(msg) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast'; t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 2500);
}
</script>

</body>
</html>
