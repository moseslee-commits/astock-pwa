<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>智能选股器 · 五维共振</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f1419; --bg-sec: #1a1f2e; --bg-ter: #252b3d;
  --border: #2d3548; --text: #e8eaed; --text-sec: #9aa0a6;
  --accent: #1677ff; --up: #ff4d4f; --down: #00b578; --warn: #faad14;
}
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text);
  padding: 16px; min-height: 100vh;
}
.header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.header h1 { font-size: 20px; font-weight: 700; }
.header .subtitle { font-size: 12px; color: var(--text-sec); margin-top: 4px; }
.stats-bar {
  display: flex; gap: 12px; margin-bottom: 16px;
}
.stat-card {
  flex: 1; background: var(--bg-sec); border-radius: 10px; padding: 14px;
  border: 1px solid var(--border);
}
.stat-label { font-size: 11px; color: var(--text-sec); margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 700; }
.stat-value.up { color: var(--up); }
.stat-value.down { color: var(--down); }
.main-layout { display: flex; gap: 16px; }
/* 移动端优化 */
.filter-toggle {
  display: none;
  width: 100%; padding: 12px; background: var(--bg-sec);
  border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); font-size: 14px; font-weight: 600;
  cursor: pointer; margin-bottom: 12px; text-align: center;
}
.filter-toggle:active { background: var(--bg-ter); }

/* 移动端卡片式结果 */
.mobile-result-cards { display: none; }

@media (max-width: 768px) {
  .main-layout { flex-direction: column; gap: 10px; }
  body { padding: 10px; }
  .header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .stats-bar { gap: 8px; }
  .stat-card { padding: 10px; }
  .stat-value { font-size: 18px; }
  
  /* 筛选面板：可折叠抽屉 */
  .filter-toggle { display: block; }
  .filter-panel { 
    width: 100%; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--bg); z-index: 2000; overflow-y: auto;
    transform: translateX(-100%); transition: transform 0.3s ease;
    border-radius: 0; padding: 60px 16px 100px;
  }
  .filter-panel.open { transform: translateX(0); box-shadow: 2px 0 20px rgba(0,0,0,0.5); }
  
  /* 结果：隐藏表格，显示卡片 */
  .result-table-wrap { display: none; }
  .mobile-result-cards { display: block; }
  
  /* 同花顺风格紧凑列表 */
  .mobile-pick-card {
    background: var(--bg-sec); border-bottom: 1px solid var(--border);
    padding: 12px 14px; margin-bottom: 0;
    cursor: pointer; transition: background 0.1s;
    display: flex; align-items: center;
    min-height: 56px;
  }
  .mobile-pick-card:active { background: var(--bg-ter); }
  .mpc-left { flex: 1; min-width: 0; }
  .mpc-name-row { display: flex; align-items: baseline; gap: 6px; }
  .mpc-name { font-size: 15px; font-weight: 600; color: var(--text); }
  .mpc-code { font-size: 11px; color: var(--text-sec); }
  .mpc-sector { font-size: 11px; color: var(--text-sec); margin-top: 2px; }
  .mpc-right { text-align: right; flex-shrink: 0; margin-left: 12px; }
  .mpc-price { font-size: 18px; font-weight: 700; font-family: Consolas, monospace; line-height: 1.2; }
  .mpc-change { font-size: 12px; font-weight: 600; font-family: Consolas, monospace; }
  .mpc-change.up { color: #ff4d4f; }
  .mpc-change.down { color: #00b578; }
  .mpc-change.flat { color: var(--text-sec); }
  .mpc-tags { display: flex; gap: 4px; margin-top: 4px; }
  .mpc-tag {
    font-size: 10px; padding: 1px 5px; border-radius: 3px;
    background: rgba(255,77,79,0.15); color: #ff4d4f;
  }
  .mpc-tag.green { background: rgba(0,181,120,0.15); color: #00b578; }
  .mpc-tag.blue { background: rgba(22,119,255,0.15); color: #1677ff; }
  .mpc-score-badge {
    display: inline-block; padding: 1px 6px; border-radius: 8px;
    font-size: 10px; font-weight: 600; margin-left: 6px;
  }
  .mpc-score-badge.high { background: rgba(82,196,26,0.2); color: #52c41a; }
  .mpc-score-badge.mid { background: rgba(250,173,20,0.2); color: #faad14; }
  .mpc-score-badge.low { background: var(--bg-ter); color: var(--text-sec); }
  
  /* 筛选遮罩 */
  .filter-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1500;
    display: none;
  }
  .filter-overlay.show { display: block; }
}
.filter-panel {
  width: 260px; flex-shrink: 0; background: var(--bg-sec);
  border-radius: 12px; padding: 16px; border: 1px solid var(--border);
  height: fit-content; position: sticky; top: 16px;
}
.filter-section { margin-bottom: 18px; }
.filter-title {
  font-size: 13px; font-weight: 600; margin-bottom: 10px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.filter-row { margin-bottom: 10px; }
.filter-label { font-size: 12px; color: var(--text-sec); margin-bottom: 4px; }
.filter-select, .filter-input {
  width: 100%; padding: 7px 10px; background: var(--bg-ter);
  border: 1px solid var(--border); border-radius: 6px; color: var(--text);
  font-size: 12px; outline: none;
}
.filter-select:focus, .filter-input:focus { border-color: var(--accent); }
.range-row { display: flex; gap: 8px; align-items: center; }
.range-row input { flex: 1; }
.range-sep { color: var(--text-sec); font-size: 12px; }
.checkbox-group { display: flex; flex-wrap: wrap; gap: 6px; }
.checkbox-item {
  display: flex; align-items: center; gap: 4px; font-size: 11px;
  padding: 4px 8px; background: var(--bg-ter); border-radius: 4px;
  cursor: pointer; border: 1px solid transparent;
}
.checkbox-item.active { border-color: var(--accent); background: rgba(22,119,255,0.1); color: var(--accent); }
.checkbox-item input { display: none; }
.strategy-cards { display: flex; gap: 8px; margin-bottom: 16px; }
.strategy-card {
  flex: 1; padding: 12px; background: var(--bg-sec); border-radius: 10px;
  border: 2px solid var(--border); cursor: pointer; transition: all 0.2s;
  text-align: center;
}
.strategy-card.active { border-color: var(--accent); background: rgba(22,119,255,0.1); }
.strategy-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.strategy-desc { font-size: 10px; color: var(--text-sec); }
.btn {
  padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer;
  font-size: 13px; font-weight: 600; transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #4096ff; }
.btn-secondary { background: var(--bg-ter); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-group { display: flex; gap: 8px; margin-top: 12px; }
.result-panel { flex: 1; min-width: 0; }
.result-table {
  width: 100%; border-collapse: collapse; background: var(--bg-sec);
  border-radius: 12px; overflow: hidden; border: 1px solid var(--border);
}
.result-table th {
  background: var(--bg-ter); padding: 10px 12px; font-size: 12px;
  text-align: left; color: var(--text-sec); font-weight: 600;
  border-bottom: 1px solid var(--border);
}
.result-table td {
  padding: 10px 12px; font-size: 13px; border-bottom: 1px solid rgba(45,53,72,0.5);
}
.result-table tr:hover { background: var(--bg-ter); }
.result-table .nums { text-align: right; font-variant-numeric: tabular-nums; }
.score-badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px;
  font-size: 12px; font-weight: 600;
}
.score-high { background: rgba(255,77,79,0.15); color: var(--up); }
.score-mid { background: rgba(250,173,20,0.15); color: var(--warn); }
.score-low { background: var(--bg-ter); color: var(--text-sec); }
.reason-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.reason-tag {
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
  background: var(--bg-ter); color: var(--text-sec);
}
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-sec);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.loading { text-align: center; padding: 40px; color: var(--text-sec); }
.loading .spinner {
  width: 32px; height: 32px; border: 3px solid var(--bg-ter);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.action-btn {
  padding: 3px 8px; font-size: 11px; border: 1px solid var(--border);
  background: var(--bg-ter); color: var(--text-sec); border-radius: 4px;
  cursor: pointer; margin-right: 4px; transition: all 0.2s;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-fav:hover { border-color: var(--up); color: var(--up); }
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--bg-ter); border: 1px solid var(--accent); color: var(--text);
  padding: 10px 20px; border-radius: 8px; font-size: 13px; z-index: 9999;
  animation: toastIn 0.3s ease;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
</style>

<body>

<div class="header">
  <div>
    <h1>🎯 智能选股器</h1>
    <div class="subtitle">五维共振选股体系 · 多条件组合筛选 · 81只全市场龙头</div>
  </div>
  <div>
    <button class="btn btn-secondary" onclick="resetFilters()">重置条件</button>
    <button class="btn btn-secondary" onclick="saveResults()" style="margin-left:8px">💾 保存结果</button>
    <button class="btn btn-primary" onclick="runScreening()" style="margin-left:8px">开始选股</button>
  </div>
</div>

<!-- 策略模板 -->
<div class="strategy-cards">
  <div class="strategy-card active" data-strategy="conservative" onclick="selectStrategy(this)">
    <div class="strategy-name">🛡️ 保守型</div>
    <div class="strategy-desc">低估值+高ROE+低波动</div>
  </div>
  <div class="strategy-card" data-strategy="balanced" onclick="selectStrategy(this)">
    <div class="strategy-name">⚖️ 稳健型</div>
    <div class="strategy-desc">五维均衡+评分≥70</div>
  </div>
  <div class="strategy-card" data-strategy="aggressive" onclick="selectStrategy(this)">
    <div class="strategy-name">🚀 激进型</div>
    <div class="strategy-desc">高成长+技术突破+放量</div>
  </div>
</div>

<!-- 统计栏 -->
<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-label">股票池总数</div>
    <div class="stat-value" id="totalCount">81</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">符合条件</div>
    <div class="stat-value up" id="matchCount">--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">平均评分</div>
    <div class="stat-value" id="avgScore">--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">平均PE</div>
    <div class="stat-value" id="avgPE">--</div>
  </div>
</div>

<div class="main-layout">
  <!-- 移动端筛选按钮 -->
  <button class="filter-toggle" onclick="toggleFilter()">⚙️ 筛选条件</button>
  <div class="filter-overlay" id="filterOverlay" onclick="toggleFilter()"></div>
  
  <!-- 筛选面板 -->
  <div class="filter-panel" id="filterPanel">
    <div class="filter-section">
      <div class="filter-title">📊 板块筛选</div>
      <div class="checkbox-group" id="sectorGroup">
        <label class="checkbox-item active"><input type="checkbox" value="all" checked>全部</label>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-title">⭐ 五维评分</div>
      <div class="filter-row">
        <div class="filter-label">综合评分区间</div>
        <div class="range-row">
          <input type="number" class="filter-input" id="minScore" placeholder="最低" value="0">
          <span class="range-sep">-</span>
          <input type="number" class="filter-input" id="maxScore" placeholder="最高" value="100">
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-label">基本面评分≥</div>
        <input type="number" class="filter-input" id="minFundamental" placeholder="0-100" value="0">
      </div>
      <div class="filter-row">
        <div class="filter-label">技术面评分≥</div>
        <input type="number" class="filter-input" id="minTechnical" placeholder="0-100" value="0">
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-title">💰 估值条件</div>
      <div class="filter-row">
        <div class="filter-label">PE区间</div>
        <div class="range-row">
          <input type="number" class="filter-input" id="minPE" placeholder="最低" value="0">
          <span class="range-sep">-</span>
          <input type="number" class="filter-input" id="maxPE" placeholder="最高" value="100">
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-label">PE分位≤</div>
        <input type="number" class="filter-input" id="maxPEPct" placeholder="0-100%" value="100">
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-title">📈 技术形态</div>
      <div class="checkbox-group" id="techGroup">
        <label class="checkbox-item"><input type="checkbox" value="bull">多头排列</label>
        <label class="checkbox-item"><input type="checkbox" value="pullback">阴线回踩</label>
        <label class="checkbox-item"><input type="checkbox" value="shrink">缩量调整</label>
        <label class="checkbox-item"><input type="checkbox" value="volume">温和放量</label>
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-title">📊 行情条件</div>
      <div class="filter-row">
        <div class="filter-label">今日涨跌幅(%)</div>
        <div class="range-row">
          <input type="number" class="filter-input" id="minChange" placeholder="最低" value="-10">
          <span class="range-sep">~</span>
          <input type="number" class="filter-input" id="maxChange" placeholder="最高" value="10">
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-label">换手率≥(%)</div>
        <input type="number" class="filter-input" id="minTurnover" placeholder="0" value="0" step="0.1">
      </div>
      <div class="filter-row">
        <div class="filter-label">量比≥</div>
        <input type="number" class="filter-input" id="minVolumeRatio" placeholder="0" value="0" step="0.1">
      </div>
    </div>

    <div class="filter-section">
      <div class="filter-title">⚠️ 风险排除</div>
      <div class="checkbox-group">
        <label class="checkbox-item active"><input type="checkbox" value="noST" checked>排除ST</label>
        <label class="checkbox-item active"><input type="checkbox" value="noHighPE" checked>排除高PE(>80)</label>
      </div>
    </div>

    <!-- 快捷预设 -->
    <div class="filter-section">
      <div class="filter-title">⚡ 快捷预设</div>
      <div class="checkbox-group" style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        <label class="checkbox-item" onclick="applyPreset('highScore')">🏆 高分优选</label>
        <label class="checkbox-item" onclick="applyPreset('lowPE')">💰 低估值</label>
        <label class="checkbox-item" onclick="applyPreset('techBreak')">📈 技术突破</label>
        <label class="checkbox-item" onclick="applyPreset('hotSector')">🔥 热门板块</label>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-secondary" style="flex:1" onclick="resetFilters()">重置</button>
      <button class="btn btn-primary" style="flex:1" onclick="runScreening()">选股</button>
    </div>
  </div>

  <!-- 结果面板 -->
  <div class="result-panel">
    <div id="resultArea">
      <div class="loading">
        <div class="spinner"></div>
        <div>正在加载股票数据...</div>
      </div>
    </div>
  </div>
</div>

// 移动端卡片渲染（同花顺风格）

    const pct = item.f3 ? Number(item.f3) / 100 : 0;
    const price = item.f2 ? Number(item.f2) / 100 : 0;
    const changeClass = pct > 0 ? 'up' : pct < 0 ? 'down' : 'flat';
    const scoreClass = item.score >= 75 ? 'high' : item.score >= 60 ? 'mid' : 'low';
    
    // 标签
    let tags = '';
    if (item.score >= 75) tags += '<span class="mpc-tag">高分</span>';
    if (item.pe > 0 && item.pe < 15) tags += '<span class="mpc-tag green">低PE</span>';
    if (pct > -2 && pct < 0) tags += '<span class="mpc-tag blue">回踩</span>';
    
    html += `<div class="mobile-pick-card" onclick="viewDetail('${item.stock.code}')">
      <div class="mpc-left">
        <div class="mpc-name-row">
          <span class="mpc-name">${item.stock.name}</span>
          <span class="mpc-code">${item.stock.code}</span>
          <span class="mpc-score-badge ${scoreClass}">${item.score}分</span>
        </div>
        <div class="mpc-sector">${item.stock.sector} · PE ${item.pe > 0 ? item.pe.toFixed(1) : '--'}</div>
        ${tags ? `<div class="mpc-tags">${tags}</div>` : ''}
      </div>
      <div class="mpc-right">
        <div class="mpc-price">${price.toFixed(2)}</div>
        <div class="mpc-change ${changeClass}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</div>

// 快捷预设
function applyPreset(type) {
  if (type === 'highScore') {
    document.getElementById('minScore').value = 60;
    document.getElementById('minFundamental').value = 50;
    document.getElementById('minTechnical').value = 50;
    document.getElementById('maxPE').value = 80;
  } else if (type === 'lowPE') {
    document.getElementById('minScore').value = 0;
    document.getElementById('maxPE').value = 30;
    document.getElementById('maxPEPct').value = 30;
  } else if (type === 'techBreak') {
    document.getElementById('minScore').value = 55;
    document.getElementById('minTechnical').value = 60;
    document.getElementById('minVolumeRatio').value = 1.5;
    document.getElementById('minChange').value = 0;
  } else if (type === 'hotSector') {
    document.getElementById('minScore').value = 55;
    document.getElementById('minChange').value = 1;
    document.getElementById('minVolumeRatio').value = 1.2;
  }
  runScreening();
}
let allData = [];
let currentStrategy = 'balanced';

// 初始化板块列表
function initSectors() {
  const sectors = [...new Set(uniqueStocks.map(s => s.sector))];
  const group = document.getElementById('sectorGroup');
  sectors.forEach(sector => {
    const label = document.createElement('label');
    label.className = 'checkbox-item';
    label.innerHTML = `<input type="checkbox" value="${sector}">${sector}`;
    label.onclick = function(e) {
      e.preventDefault();
      this.classList.toggle('active');
      const input = this.querySelector('input');
      input.checked = !input.checked;
      // 全部选项处理
      if (this.querySelector('input').value === 'all') {
        document.querySelectorAll('#sectorGroup .checkbox-item').forEach(item => {
          if (item.querySelector('input').value !== 'all') {
            item.classList.remove('active');
            item.querySelector('input').checked = false;
          }
        });
      } else {
        document.querySelector('#sectorGroup .checkbox-item input[value=all]').checked = false;
        document.querySelector('#sectorGroup .checkbox-item').classList.remove('active');
      }
    };
    group.appendChild(label);
  });
}

// 应用策略模板

    document.getElementById('minScore').value = 70;

// 加载行情数据
async function loadData() {
  const secids = uniqueStocks.map(s => (s.code.startsWith('6') ? '1.' : '0.') + s.code);
  const batches = [];
  for (let i = 0; i < secids.length; i += 30) {
    batches.push(secids.slice(i, i + 30));
  }

  const results = [];
  for (const batch of batches) {
    try {
      const url = `https://push2delay.eastmoney.com/api/qt/ulist.np/get?secids=${batch.join(',')}&fields=f12,f14,f2,f3,f9,f23,f10,f6,f15,f16,f17,f18`;
      const resp = await fetch(url);
      const data = await resp.json();
      if (data.data && data.data.diff) {
        results.push(...data.data.diff);
      }
    } catch(e) { console.error('加载失败', e); }
  }
  return results;
}

// 计算简单评分
function calcSimpleScore(d) {
  let score = 50;
  const pe = d.f9 ? Number(d.f9) / 100 : 0;
  const pct = d.f3 ? Number(d.f3) / 100 : 0;
  const volRatio = d.f10 ? Number(d.f10) / 100 : 0;

  // PE评分（越低越好）
  if (pe > 0 && pe < 15) score += 15;
  else if (pe > 0 && pe < 30) score += 10;
  else if (pe > 0 && pe < 50) score += 5;

  // 涨跌幅（温和上涨加分）
  if (pct > -3 && pct < 0) score += 10;
  else if (pct >= 0 && pct < 2) score += 5;

  // 量比（温和放量加分）
  if (volRatio >= 1 && volRatio <= 2) score += 10;

  // 成交额
  if (d.f6 && Number(d.f6) > 1e8) score += 5;

  return Math.min(100, Math.max(0, score));
}

// 执行选股
async function runScreening() {
  document.getElementById('resultArea').innerHTML = '<div class="loading"><div class="spinner"></div><div>正在选股...</div></div>';

  if (allData.length === 0) {
    allData = await loadData();
  }

  // 获取筛选条件
  const minScore = Number(document.getElementById('minScore').value) || 0;
  const maxScore = Number(document.getElementById('maxScore').value) || 100;
  const minFundamental = Number(document.getElementById('minFundamental').value) || 0;
  const minTechnical = Number(document.getElementById('minTechnical').value) || 0;
  const minPE = Number(document.getElementById('minPE').value) || 0;
  const maxPE = Number(document.getElementById('maxPE').value) || 100;
  const maxPEPct = Number(document.getElementById('maxPEPct').value) || 100;

  // 选中的板块
  const selectedSectors = [];
  document.querySelectorAll('#sectorGroup input:checked').forEach(input => {
    if (input.value !== 'all') selectedSectors.push(input.value);
  });

  // 技术形态
  const techConditions = [];
  document.querySelectorAll('#techGroup input:checked').forEach(input => techConditions.push(input.value));

  // 筛选
  let filtered = allData.map(d => {
    const stock = uniqueStocks.find(s => s.code === d.f12);
    if (!stock) return null;
    const score = calcSimpleScore(d);
    const pe = d.f9 ? Number(d.f9) / 100 : 0;
    return { ...d, stock, score, pe };
  }).filter(item => {
    if (!item) return false;
    // 板块筛选
    if (selectedSectors.length > 0 && !selectedSectors.includes(item.stock.sector)) return false;
    // 评分筛选
    if (item.score < minScore || item.score > maxScore) return false;
    // PE筛选
    if (item.pe > 0 && (item.pe < minPE || item.pe > maxPE)) return false;
    return true;
  });

  // 按评分排序
  filtered.sort((a, b) => b.score - a.score);

  // 更新统计
  document.getElementById('matchCount').textContent = filtered.length;
  document.getElementById('avgScore').textContent = filtered.length > 0 ? (filtered.reduce((s, i) => s + i.score, 0) / filtered.length).toFixed(1) : '--';
  const validPEs = filtered.filter(i => i.pe > 0).map(i => i.pe);
  document.getElementById('avgPE').textContent = validPEs.length > 0 ? (validPEs.reduce((s, p) => s + p, 0) / validPEs.length).toFixed(1) : '--';

  // 渲染结果
  renderResults(filtered);
  renderMobileCards(filtered);
}

// 渲染结果
function renderResults(data) {
  if (data.length === 0) {
    document.getElementById('resultArea').innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <div>没有符合条件的股票</div>
        <div style="font-size:12px;margin-top:8px">请尝试放宽筛选条件</div>
      </div>`;
    return;
  }

  let html = '<table class="result-table"><thead><tr>';
  html += '<th>代码</th><th>名称</th><th>板块</th>';
  html += '<th class="nums">评分</th><th class="nums">现价</th><th class="nums">涨跌幅</th>';
  html += '<th class="nums">换手率</th><th class="nums">量比</th>';
  html += '<th class="nums">PE</th><th>选股理由</th><th>操作</th>';
  html += '</tr></thead><tbody>';

  data.slice(0, 50).forEach(item => {
    const pct = item.f3 ? Number(item.f3) / 100 : 0;
    const price = item.f2 ? Number(item.f2) / 100 : 0;
    const scoreClass = item.score >= 75 ? 'score-high' : item.score >= 60 ? 'score-mid' : 'score-low';

    // 选股理由
    const reasons = [];
    if (item.score >= 75) reasons.push('高分');
    if (item.pe > 0 && item.pe < 15) reasons.push('低PE');
    if (pct > -3 && pct < 0) reasons.push('阴线回踩');
    if (item.f10 && Number(item.f10)/100 >= 1 && Number(item.f10)/100 <= 2) reasons.push('温和放量');

    html += '<tr>';
    html += `<td style="color:var(--text-sec);font-family:monospace">${item.stock.code}</td>`;
    html += `<td><strong>${item.stock.name}</strong></td>`;
    html += `<td style="color:var(--text-sec)">${item.stock.sector}</td>`;
    html += `<td class="nums"><span class="score-badge ${scoreClass}">${item.score}</span></td>`;
    html += `<td class="nums">${price.toFixed(2)}</td>`;
    html += `<td class="nums" style="color:${pct >= 0 ? 'var(--up)' : 'var(--down)'}">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</td>`;
    const turnover = item.f8 ? Number(item.f8) / 100 : 0;
    const volRatio = item.f10 ? Number(item.f10) / 100 : 0;
    html += `<td class="nums">${turnover > 0 ? turnover.toFixed(2) + '%' : '--'}</td>`;
    html += `<td class="nums">${volRatio > 0 ? volRatio.toFixed(2) : '--'}</td>`;
    html += `<td class="nums">${item.pe > 0 ? item.pe.toFixed(1) : '--'}</td>`;
    html += `<td><div class="reason-tags">${reasons.map(r => `<span class="reason-tag">${r}</span>`).join('')}</div></td>`;
    html += `<td style="white-space:nowrap">
      <button class="action-btn" onclick="viewDetail('${item.stock.code}')">详情</button>
      <button class="action-btn action-fav" onclick="addFavorite('${item.stock.code}','${item.stock.name}')">+自选</button>
    </td>`;
    html += '</tr>';
  });

  html += '</tbody></table>';
  if (data.length > 50) {
    html += `<div style="text-align:center;padding:12px;color:var(--text-sec);font-size:12px">仅显示前50只，共${data.length}只符合条件</div>`;
  }
  document.getElementById('resultArea').innerHTML = html;
}

// 保存选股结果
function saveResults() {
  const rows = document.querySelectorAll('.result-table tbody tr');
  if (rows.length === 0) { showToast('没有可保存的选股结果'); return; }
  const stocks = [];
  rows.forEach(row => {
    const cells = row.querySelectorAll('td');
    if (cells.length >= 3) {
      stocks.push({
        code: cells[0].textContent.trim(),
        name: cells[1].textContent.trim(),
        sector: cells[2].textContent.trim()
      });
    }
  });
  const history = JSON.parse(localStorage.getItem('astock_selection_history') || '[]');
  history.unshift({
    date: new Date().toLocaleString('zh-CN'),
    strategy: currentStrategy,
    count: stocks.length,
    stocks: stocks.map(s => s.name)
  });
  localStorage.setItem('astock_selection_history', JSON.stringify(history.slice(0, 50)));
  showToast(`✅ 已保存 ${stocks.length} 只选股结果`);
}

// 查看详情（跳转到看板）
function viewDetail(code) {
  window.parent.postMessage({ type: 'navigate', page: 'dashboard', code: code }, '*');
  showToast(`正在跳转到看板查看 ${code} 详情...`);
}

// 加入自选
function addFavorite(code, name) {
  const favorites = JSON.parse(localStorage.getItem('astock_favorites') || '[]');
  if (!favorites.find(f => f.code === code)) {
    const market = code.startsWith('6') ? '1' : '0';
    const secid = market + '.' + code;
    favorites.push({ code, name, secid, addTime: new Date().toLocaleString('zh-CN') });
    localStorage.setItem('astock_favorites', JSON.stringify(favorites));
    showToast(`✅ ${name} 已加入自选股`);
  } else {
    showToast(`⚠️ ${name} 已在自选股中`);
  }
}

window.addEventListener('storage', function(e) {
  if (e.key === 'astock_favorites') {
    // 自选股已更新，刷新UI
  }

// Toast提示
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2500);
}

initSectors();
