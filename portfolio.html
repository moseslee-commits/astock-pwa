<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>持仓管理 · A股智能选股系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0e1217;
    color: #e0e6ed;
    line-height: 1.6;
    font-size: 14px;
    min-height: 100vh;
}
:root {
    --bg: #0e1217;
    --card: #1a1f2e;
    --border: #2a3142;
    --text: #e0e6ed;
    --text-sec: #8b95a7;
    --up: #ff4d4f;
    --down: #52c41a;
    --flat: #8b95a7;
    --accent: #6366f1;
    --accent-light: rgba(99, 102, 241, 0.15);
}
.container { max-width: 1200px; margin: 0 auto; padding: 20px 24px 40px; }
.header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.header h1 { font-size: 22px; font-weight: 700; }
.header .sub { font-size: 13px; color: var(--text-sec); margin-left: 8px; font-weight: 400; }
.header-right { display: flex; gap: 10px; align-items: center; }
.btn {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 13px;
    transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); background: var(--accent-light); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #5558e3; }
.btn-danger { color: var(--down); border-color: rgba(82,196,26,0.3); }
.btn-danger:hover { background: rgba(82,196,26,0.1); }

.asset-overview {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; margin-bottom: 20px;
}
.asset-main { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
.asset-total .label { font-size: 13px; color: var(--text-sec); margin-bottom: 4px; }
.asset-total .value { font-size: 36px; font-weight: 700; font-family: "SF Mono", "Consolas", monospace; }
.asset-total .change { font-size: 15px; margin-top: 4px; font-weight: 600; }
.asset-details {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 16px; padding-top: 20px; border-top: 1px solid var(--border);
}
.asset-item .label { font-size: 12px; color: var(--text-sec); margin-bottom: 4px; }
.asset-item .value { font-size: 18px; font-weight: 600; font-family: "SF Mono", "Consolas", monospace; }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
}
.chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-sec); }
.chart-card canvas { width: 100%; height: 200px; }

.tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab-btn {
    padding: 10px 20px; background: none; border: none; cursor: pointer;
    font-size: 14px; color: var(--text-sec); border-bottom: 2px solid transparent;
    transition: all 0.2s; font-weight: 500;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab-content { display: none; }
.tab-content.active { display: block; }

table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
}
th {
    background: #141822; color: var(--text-sec); font-weight: 600; font-size: 12px;
    padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap;
}
th.num { text-align: right; }
td { padding: 10px 12px; border-bottom: 1px solid rgba(42,49,66,0.5); font-size: 13px; }
td.num { text-align: right; font-family: "SF Mono", "Consolas", monospace; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
tr:hover { background: rgba(99,102,241,0.05); }
.code { color: var(--text-sec); font-family: "Consolas", monospace; font-size: 12px; }
.name { font-weight: 600; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--flat); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-sec); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .text { font-size: 14px; margin-bottom: 4px; }
.empty-state .hint { font-size: 12px; opacity: 0.7; margin-bottom: 16px; }

.modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; width: 420px; max-width: 90vw;
}
.modal h3 { font-size: 18px; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: var(--text-sec); margin-bottom: 6px; }
.form-group input, .form-group select {
    width: 100%; padding: 10px 12px; background: #141822; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 14px; outline: none;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

.toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; }
.toast {
    padding: 12px 20px; border-radius: 8px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font-size: 13px; animation: slideIn 0.3s ease;
}
.toast.success { border-color: rgba(82,196,26,0.5); }
.toast.error { border-color: rgba(255,77,79,0.5); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 768px) {
    .chart-row { grid-template-columns: 1fr; }
    .asset-main { flex-direction: column; align-items: flex-start; }
    .asset-total .value { font-size: 28px; }
}
</style>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0e1217">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="智能选股">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>持仓管理 <span class="sub">实时盈亏 · 交易记录</span></h1>
        </div>
        <div class="header-right">
            <span id="updateTime" style="font-size:12px;color:var(--text-sec)">更新中...</span>
            <button class="btn" onclick="refreshPrices()">🔄 刷新行情</button>
            <button class="btn btn-primary" onclick="openAddModal()">➕ 添加持仓</button>
        </div>
    </div>

    <div class="asset-overview">
        <div class="asset-main">
            <div class="asset-total">
                <div class="label">总资产</div>
                <div class="value" id="totalAsset">¥0.00</div>
                <div class="change" id="totalChange">--</div>
            </div>
        </div>
        <div class="asset-details">
            <div class="asset-item"><div class="label">可用资金</div><div class="value" id="cash">¥100,000.00</div></div>
            <div class="asset-item"><div class="label">持仓市值</div><div class="value" id="marketValue">¥0.00</div></div>
            <div class="asset-item"><div class="label">持仓成本</div><div class="value" id="totalCost">¥0.00</div></div>
            <div class="asset-item"><div class="label">浮动盈亏</div><div class="value" id="floatPnl">--</div></div>
            <div class="asset-item"><div class="label">已实现盈亏</div><div class="value" id="realizedPnl">¥0.00</div></div>
            <div class="asset-item"><div class="label">持仓只数</div><div class="value" id="positionCount">0 只</div></div>
            <div class="asset-item"><div class="label">今日盈亏</div><div class="value" id="todayPnl">--</div></div>
            <div class="asset-item"><div class="label">仓位</div><div class="value" id="positionRatio">0%</div></div>
        </div>
    </div>

    <div class="chart-row">
        <div class="chart-card">
            <h3>持仓分布（市值）</h3>
            <canvas id="pieChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>个股盈亏</h3>
            <canvas id="profitChart"></canvas>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="positions">当前持仓 (<span id="posCount">0</span>)</button>
        <button class="tab-btn" data-tab="trades">交易记录 (<span id="tradeCount">0</span>)</button>
    </div>

    <div class="tab-content active" id="tab-positions">
        <table id="positionTable">
            <thead>
                <tr>
                    <th>代码</th><th>名称</th><th class="num">持仓</th><th class="num">成本价</th>
                    <th class="num">现价</th><th class="num">市值</th><th class="num">盈亏</th>
                    <th class="num">盈亏%</th><th class="num">操作</th>
                </tr>
            </thead>
            <tbody id="positionBody"></tbody>
        </table>
        <div class="empty-state" id="positionEmpty" style="display:none">
            <div class="icon">📊</div>
            <div class="text">暂无持仓</div>
            <div class="hint">点击右上角"添加持仓"开始跟踪</div>
            <button class="btn btn-primary" onclick="openAddModal()">添加持仓</button>
        </div>
    </div>

    <div class="tab-content" id="tab-trades">
        <table id="tradeTable">
            <thead>
                <tr><th>时间</th><th>代码</th><th>名称</th><th>类型</th><th class="num">价格</th><th class="num">数量</th><th class="num">金额</th></tr>
            </thead>
            <tbody id="tradeBody"></tbody>
        </table>
        <div class="empty-state" id="tradeEmpty" style="display:none">
            <div class="icon">📝</div>
            <div class="text">暂无交易记录</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h3>添加持仓</h3>
        <div class="form-group">
            <label>股票代码</label>
            <input type="text" id="inputCode" placeholder="如：600519" maxlength="6">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>买入价格</label>
                <input type="number" id="inputPrice" placeholder="0.00" step="0.01">
            </div>
            <div class="form-group">
                <label>持仓数量</label>
                <input type="number" id="inputShares" placeholder="100" step="100">
            </div>
        </div>
        <div class="form-group">
            <label>买入日期</label>
            <input type="date" id="inputDate">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeAddModal()">取消</button>
            <button class="btn btn-primary" onclick="addPosition()">确认添加</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const STORAGE_KEY = 'astock_positions';
const TRADE_KEY = 'astock_trades';
const CASH_KEY = 'astock_cash';
const INITIAL_CASH = 100000;

let positions = [];
let trades = [];
let cash = INITIAL_CASH;
let priceCache = {};

function loadData() {
    try {
        positions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        trades = JSON.parse(localStorage.getItem(TRADE_KEY)) || [];
        cash = parseFloat(localStorage.getItem(CASH_KEY)) || INITIAL_CASH;
    } catch(e) { positions = []; trades = []; cash = INITIAL_CASH; }
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
    localStorage.setItem(TRADE_KEY, JSON.stringify(trades));
    localStorage.setItem(CASH_KEY, cash.toString());
}

function showToast(msg, type='success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = 'toast ' + type;
    toast.textContent = msg;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
}

function openAddModal() {
    document.getElementById('addModal').classList.add('active');
    document.getElementById('inputCode').value = '';
    document.getElementById('inputPrice').value = '';
    document.getElementById('inputShares').value = '';
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('inputCode').focus();
}

function closeAddModal() {
    document.getElementById('addModal').classList.remove('active');
}

function addPosition() {
    const code = document.getElementById('inputCode').value.trim();
    const price = parseFloat(document.getElementById('inputPrice').value);
    const shares = parseInt(document.getElementById('inputShares').value);
    const date = document.getElementById('inputDate').value;

    if (!code || code.length !== 6) { showToast('请输入6位股票代码', 'error'); return; }
    if (!price || price <= 0) { showToast('请输入有效价格', 'error'); return; }
    if (!shares || shares <= 0) { showToast('请输入有效数量', 'error'); return; }

    const cost = price * shares;
    if (cost > cash) { showToast('可用资金不足', 'error'); return; }

    const existing = positions.find(p => p.code === code);
    if (existing) {
        const totalCost = existing.cost * existing.shares + cost;
        const totalShares = existing.shares + shares;
        existing.cost = totalCost / totalShares;
        existing.shares = totalShares;
    } else {
        positions.push({ code, name: code, cost, shares, date });
    }

    cash -= cost;
    trades.unshift({ time: new Date().toLocaleString(), code, name: code, type: 'buy', price, shares, amount: cost, date });

    saveData();
    closeAddModal();
    fetchStockName(code);
    render();
    showToast('持仓添加成功');
}

function sellPosition(code) {
    const pos = positions.find(p => p.code === code);
    if (!pos) return;
    const sellShares = parseInt(prompt(`卖出 ${pos.name}(${code})\n当前持仓: ${pos.shares}股\n现价: ${priceCache[code]?.toFixed(2) || pos.cost.toFixed(2)}\n\n卖出数量:`, pos.shares));
    if (!sellShares || sellShares <= 0) return;
    if (sellShares > pos.shares) { showToast('卖出数量超过持仓', 'error'); return; }

    const sellPrice = priceCache[code] || pos.cost;
    const amount = sellPrice * sellShares;
    const pnl = (sellPrice - pos.cost) * sellShares;

    cash += amount;
    pos.shares -= sellShares;
    if (pos.shares <= 0) {
        positions = positions.filter(p => p.code !== code);
    }

    trades.unshift({ time: new Date().toLocaleString(), code, name: pos.name, type: 'sell', price: sellPrice, shares: sellShares, amount, pnl });
    saveData();
    render();
    showToast(`卖出成功，盈亏: ${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}`);
}

function deletePosition(code) {
    if (!confirm('确定删除该持仓记录吗？（不影响资金）')) return;
    positions = positions.filter(p => p.code !== code);
    saveData();
    render();
    showToast('已删除');
}

async function fetchStockName(code) {
    try {
        const secid = (code.startsWith('6') ? '1.' : '0.') + code;
        const resp = await fetch(`https://push2delay.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f58`);
        const data = await resp.json();
        if (data?.data?.f58) {
            const pos = positions.find(p => p.code === code);
            if (pos) { pos.name = data.data.f58; saveData(); render(); }
            const trade = trades.find(t => t.code === code);
            if (trade && trade.name === code) { trade.name = data.data.f58; saveData(); }
        }
    } catch(e) {}
}

async function fetchPrices() {
    if (positions.length === 0) return;
    const codes = positions.map(p => (p.code.startsWith('6') ? '1.' : '0.') + p.code).join(',');
    try {
        const resp = await fetch(`https://push2delay.eastmoney.com/api/qt/ulist.np/get?secids=${codes}&fields=f2,f3,f12,f14`);
        const data = await resp.json();
        if (data?.data?.diff) {
            data.data.diff.forEach(item => {
                priceCache[item.f12] = item.f2;
                const pos = positions.find(p => p.code === item.f12);
                if (pos && item.f14) { pos.name = item.f14; }
            });
            saveData();
        }
    } catch(e) { console.error('行情获取失败', e); }
}

async function refreshPrices() {
    document.getElementById('updateTime').textContent = '更新中...';
    await fetchPrices();
    render();
    document.getElementById('updateTime').textContent = '更新于 ' + new Date().toLocaleTimeString();
    showToast('行情已刷新');
}

function render() {
    let marketValue = 0, totalCost = 0, floatPnl = 0;
    const pieData = [], profitData = [];

    positions.forEach(pos => {
        const price = priceCache[pos.code] || pos.cost;
        const value = price * pos.shares;
        const cost = pos.cost * pos.shares;
        const pnl = value - cost;
        marketValue += value;
        totalCost += cost;
        floatPnl += pnl;
        pieData.push({ name: pos.name, value });
        profitData.push({ name: pos.name, value: (pnl / cost * 100) });
    });

    const totalAsset = cash + marketValue;
    const totalPnl = totalAsset - INITIAL_CASH;
    const pnlPercent = (totalPnl / INITIAL_CASH * 100);

    document.getElementById('totalAsset').textContent = '¥' + totalAsset.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('totalChange').textContent = `${totalPnl >= 0 ? '+' : ''}${totalPnl.toFixed(2)} (${pnlPercent >= 0 ? '+' : ''}${pnlPercent.toFixed(2)}%)`;
    document.getElementById('totalChange').className = 'change ' + (totalPnl >= 0 ? 'up' : 'down');
    document.getElementById('cash').textContent = '¥' + cash.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('marketValue').textContent = '¥' + marketValue.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('totalCost').textContent = '¥' + totalCost.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('floatPnl').textContent = `${floatPnl >= 0 ? '+' : ''}¥${floatPnl.toFixed(2)}`;
    document.getElementById('floatPnl').className = 'value ' + (floatPnl >= 0 ? 'up' : 'down');
    document.getElementById('positionCount').textContent = positions.length + ' 只';
    document.getElementById('positionRatio').textContent = marketValue > 0 ? (marketValue / totalAsset * 100).toFixed(1) + '%' : '0%';

    const realizedPnl = trades.filter(t => t.type === 'sell').reduce((sum, t) => sum + (t.pnl || 0), 0);
    document.getElementById('realizedPnl').textContent = `${realizedPnl >= 0 ? '+' : ''}¥${realizedPnl.toFixed(2)}`;
    document.getElementById('realizedPnl').className = 'value ' + (realizedPnl >= 0 ? 'up' : 'down');
    document.getElementById('todayPnl').textContent = '--';

    document.getElementById('posCount').textContent = positions.length;
    document.getElementById('tradeCount').textContent = trades.length;

    const tbody = document.getElementById('positionBody');
    const empty = document.getElementById('positionEmpty');
    if (positions.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        document.getElementById('positionTable').style.display = 'none';
    } else {
        empty.style.display = 'none';
        document.getElementById('positionTable').style.display = 'table';
        tbody.innerHTML = positions.map(pos => {
            const price = priceCache[pos.code] || pos.cost;
            const value = price * pos.shares;
            const cost = pos.cost * pos.shares;
            const pnl = value - cost;
            const pnlPct = cost > 0 ? (pnl / cost * 100) : 0;
            const cls = pnl >= 0 ? 'up' : 'down';
            return `<tr>
                <td class="code">${pos.code}</td>
                <td class="name">${pos.name}</td>
                <td class="num">${pos.shares}</td>
                <td class="num">${pos.cost.toFixed(2)}</td>
                <td class="num">${price.toFixed(2)}</td>
                <td class="num">${value.toFixed(2)}</td>
                <td class="num ${cls}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}</td>
                <td class="num ${cls}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</td>
                <td class="num">
                    <button class="btn" style="padding:4px 10px;font-size:12px" onclick="sellPosition('${pos.code}')">卖出</button>
                    <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deletePosition('${pos.code}')">删除</button>
                </td>
            </tr>`;
        }).join('');
    }

    const tradeBody = document.getElementById('tradeBody');
    const tradeEmpty = document.getElementById('tradeEmpty');
    if (trades.length === 0) {
        tradeBody.innerHTML = '';
        tradeEmpty.style.display = 'block';
        document.getElementById('tradeTable').style.display = 'none';
    } else {
        tradeEmpty.style.display = 'none';
        document.getElementById('tradeTable').style.display = 'table';
        tradeBody.innerHTML = trades.map(t => {
            const tagCls = t.type === 'buy' ? 'buy' : 'sell';
            const tagText = t.type === 'buy' ? '买入' : '卖出';
            return `<tr>
                <td style="font-size:12px;color:var(--text-sec)">${t.time}</td>
                <td class="code">${t.code}</td>
                <td class="name">${t.name}</td>
                <td><span class="trade-tag ${tagCls}" style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:${t.type==='buy'?'rgba(255,77,79,0.15)':'rgba(82,196,26,0.12)'};color:${t.type==='buy'?'var(--up)':'var(--down)'}">${tagText}</span></td>
                <td class="num">${t.price.toFixed(2)}</td>
                <td class="num">${t.shares}</td>
                <td class="num">${t.amount.toFixed(2)}</td>
            </tr>`;
        }).join('');
    }

    drawPieChart(pieData);
    drawProfitChart(profitData);
}

function drawPieChart(data) {
    const canvas = document.getElementById('pieChart');
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = 200 * 2;
    ctx.scale(2, 2);
    ctx.clearRect(0, 0, W/2, H/2);

    if (data.length === 0) {
        ctx.fillStyle = '#8b95a7';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无持仓数据', W/4, H/4);
        return;
    }

    const total = data.reduce((s, d) => s + d.value, 0);
    const colors = ['#6366f1', '#ff4d4f', '#52c41a', '#faad14', '#13c2c2', '#722ed1', '#eb2f96', '#fa8c16'];
    const cx = W/4, cy = H/4, r = 70, rInner = 40;
    let startAngle = -Math.PI / 2;

    data.forEach((d, i) => {
        const angle = (d.value / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, startAngle, startAngle + angle);
        ctx.arc(cx, cy, rInner, startAngle + angle, startAngle, true);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        startAngle += angle;
    });

    ctx.fillStyle = '#e0e6ed';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('¥' + (total/10000).toFixed(2) + '万', cx, cy + 5);
    ctx.fillStyle = '#8b95a7';
    ctx.font = '11px sans-serif';
    ctx.fillText('总市值', cx, cy + 22);
}

function drawProfitChart(data) {
    const canvas = document.getElementById('profitChart');
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = 200 * 2;
    ctx.scale(2, 2);
    ctx.clearRect(0, 0, W/2, H/2);

    if (data.length === 0) {
        ctx.fillStyle = '#8b95a7';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无盈亏数据', W/4, H/4);
        return;
    }

    const maxVal = Math.max(...data.map(d => Math.abs(d.value)), 1);
    const barW = Math.min(40, (W/2 - 40) / data.length - 10);
    const startX = 20;
    const zeroY = H/4 - 30;
    const scale = (H/4 - 50) / maxVal;

    ctx.strokeStyle = '#2a3142';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, zeroY);
    ctx.lineTo(W/2, zeroY);
    ctx.stroke();

    data.forEach((d, i) => {
        const x = startX + i * (barW + 10) + barW/2;
        const h = Math.abs(d.value) * scale;
        const y = d.value >= 0 ? zeroY - h : zeroY;
        ctx.fillStyle = d.value >= 0 ? '#ff4d4f' : '#52c41a';
        ctx.fillRect(x - barW/2, y, barW, h);
        ctx.fillStyle = '#8b95a7';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.name.substring(0,4), x, H/4 - 8);
    });
}

document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
        document.getElementById('tab-' + this.dataset.tab).classList.add('active');
    });
});

document.getElementById('addModal').addEventListener('click', function(e) {
    if (e.target === this) closeAddModal();
});

loadData();
render();
refreshPrices();
setInterval(refreshPrices, 30000);
