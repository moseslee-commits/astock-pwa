<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>持仓管理 · A股智能选股系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0e1217;
    color: #e0e6ed;
    line-height: 1.6;
    font-size: 14px;
    min-height: 100vh;
}
:root {
    --bg: #0e1217;
    --card: #1a1f2e;
    --border: #2a3142;
    --text: #e0e6ed;
    --text-sec: #8b95a7;
    --up: #ff4d4f;
    --down: #52c41a;
    --flat: #8b95a7;
    --accent: #6366f1;
    --accent-light: rgba(99, 102, 241, 0.15);
}
.container { max-width: 1200px; margin: 0 auto; padding: 20px 24px 40px; padding-bottom: 90px; }

/* 移动端适配 */
@media (max-width: 768px) {  /* 全局：固定窗口，禁止横向溢出 */
  html, body {
    overflow-x: hidden;
    max-width: 100vw;
  }
  * { max-width: 100%; }
  img, canvas, svg { max-width: 100%; height: auto; }
  body { padding-bottom: 90px !important; }

  .container { padding: 12px; }
  .header { flex-direction: column; align-items: flex-start; gap: 10px; }
  .asset-overview { padding: 16px; }
  .asset-total .value { font-size: 28px; }
  .asset-details { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .chart-row { grid-template-columns: 1fr; }
  
  /* 持仓表格改卡片 */
  .position-table { display: none; }
  .mobile-positions { display: block; }
  
  .pos-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
  }
  .pos-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .pos-name { font-size: 15px; font-weight: 600; }
  .pos-code { font-size: 11px; color: var(--text-sec); margin-left: 6px; }
  .pos-pnl { font-size: 16px; font-weight: 700; font-family: Consolas, monospace; }
  .pos-pnl.up { color: var(--up); }
  .pos-pnl.down { color: var(--down); }
  .pos-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-sec); }
  .pos-meta-item { text-align: center; }
  .pos-meta-val { font-size: 12px; color: var(--text); font-weight: 600; margin-top: 2px; }
  .pos-actions { margin-top: 8px; display: flex; gap: 8px; }
  .pos-actions .btn { flex: 1; padding: 6px; font-size: 12px; }
}
.mobile-positions { display: none; }
.header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.header h1 { font-size: 22px; font-weight: 700; }
.header .sub { font-size: 13px; color: var(--text-sec); margin-left: 8px; font-weight: 400; }
.header-right { display: flex; gap: 10px; align-items: center; }
.btn {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 13px;
    transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); background: var(--accent-light); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #5558e3; }
.btn-danger { color: var(--down); border-color: rgba(82,196,26,0.3); }
.btn-danger:hover { background: rgba(82,196,26,0.1); }

.asset-overview {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px; margin-bottom: 20px;
}
.asset-main { display: flex; align-items: flex-end; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
.asset-total .label { font-size: 13px; color: var(--text-sec); margin-bottom: 4px; }
.asset-total .value { font-size: 36px; font-weight: 700; font-family: "SF Mono", "Consolas", monospace; }
.asset-total .change { font-size: 15px; margin-top: 4px; font-weight: 600; }
.asset-details {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 16px; padding-top: 20px; border-top: 1px solid var(--border);
}
.asset-item .label { font-size: 12px; color: var(--text-sec); margin-bottom: 4px; }
.asset-item .value { font-size: 18px; font-weight: 600; font-family: "SF Mono", "Consolas", monospace; }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px;
}
.chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-sec); }
.chart-card canvas { width: 100%; height: 200px; }

.tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
.tab-btn {
    padding: 10px 20px; background: none; border: none; cursor: pointer;
    font-size: 14px; color: var(--text-sec); border-bottom: 2px solid transparent;
    transition: all 0.2s; font-weight: 500;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab-content { display: none; }
.tab-content.active { display: block; }

table {
    width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
}
th {
    background: #141822; color: var(--text-sec); font-weight: 600; font-size: 12px;
    padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap;
}
th.num { text-align: right; }
td { padding: 10px 12px; border-bottom: 1px solid rgba(42,49,66,0.5); font-size: 13px; }
td.num { text-align: right; font-family: "SF Mono", "Consolas", monospace; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
tr:hover { background: rgba(99,102,241,0.05); }
.code { color: var(--text-sec); font-family: "Consolas", monospace; font-size: 12px; }
.name { font-weight: 600; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--flat); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-sec); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .text { font-size: 14px; margin-bottom: 4px; }
.empty-state .hint { font-size: 12px; opacity: 0.7; margin-bottom: 16px; }

.modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;
}
.modal-overlay.active { display: flex; }
.modal {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 24px; width: 420px; max-width: 90vw;
}
.modal h3 { font-size: 18px; margin-bottom: 20px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: var(--text-sec); margin-bottom: 6px; }
.form-group input, .form-group select {
    width: 100%; padding: 10px 12px; background: #141822; border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 14px; outline: none;
}
.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

.toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; }
.toast {
    padding: 12px 20px; border-radius: 8px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font-size: 13px; animation: slideIn 0.3s ease;
}
.toast.success { border-color: rgba(82,196,26,0.5); }
.toast.error { border-color: rgba(255,77,79,0.5); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 768px) {
    .chart-row { grid-template-columns: 1fr; }
    .asset-main { flex-direction: column; align-items: flex-start; }
    .asset-total .value { font-size: 28px; }
}

/* 移动端底部导航 */
.mobile-bottom-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(26,31,46,0.96); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    justify-content: space-around;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 997;
}
.mobile-nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 16px; color: #8b95a7; text-decoration: none;
    font-size: 11px; font-weight: 600; min-width: 60px; min-height: 48px;
    justify-content: center; position: relative;
}
.mobile-nav-item .icon { font-size: 22px; }
.mobile-nav-item.active { color: #6366f1; }
.mobile-nav-item.active::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 24px; height: 3px; border-radius: 0 0 2px 2px; background: #6366f1;
}

/* ===== MOBILE APP UI v3 —— 统一手机端框架（自动注入） ===== */
/* 平板/手机：底部 Tab 一律显示 */
@media (max-width: 768px) {
  .mobile-bottom-nav { display: flex !important; }
}
/* 触屏设备：触摸目标 >=44px，输入框 16px 防 iOS 自动缩放 */
@media (pointer: coarse) {
  button, .btn, .action-btn, .filter-toggle, .sector-tag, .quick-tag, .tab-btn,
  .mobile-nav-item, .nav-item, .menu-item { min-height: 44px; }
  input[type="text"], input[type="number"], input[type="search"], input[type="date"], select, textarea { font-size: 16px !important; }
}
/* 手机竖屏精细适配（覆盖 360–480px 主流机型） */
@media (max-width: 480px) {
  html { -webkit-text-size-adjust: 100%; }
  body { padding-left: 0 !important; padding-right: 0 !important; overflow-x: hidden; }
  .container, .main-layout, .content, .wrap, .page {
    padding-left: 12px !important; padding-right: 12px !important;
    max-width: 100vw !important;
  }
  .header { padding-top: calc(10px + env(safe-area-inset-top, 0px)) !important; }
  .header h1 { font-size: 18px !important; line-height: 1.3; }
  .header .sub, .header .subtitle { font-size: 11px !important; line-height: 1.45; }
  .stats-bar, .stats-grid, .summary-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
  .card, .panel, .stat-card, .strategy-card, .alert-card, .position-card, .result-card, .menu-list {
    border-radius: 12px !important;
  }
  table { font-size: 12px !important; }
  th { font-size: 11px !important; padding: 8px 5px !important; }
  td { padding: 9px 5px !important; }
  button, .btn { font-size: 13px !important; min-height: 40px; }
  /* 底部 Tab：5 项均分，图标+文字，安全区留白 */
  .mobile-bottom-nav {
    display: flex !important;
    position: fixed; bottom: 0; left: 0; right: 0;
    align-items: stretch; justify-content: space-around;
    background: rgba(18,23,32,0.97);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.09);
    padding: 5px 2px calc(5px + env(safe-area-inset-bottom, 0px));
    z-index: 1000; box-shadow: 0 -6px 24px rgba(0,0,0,0.35);
  }
  .mobile-nav-item {
    flex: 1 1 0 !important; min-width: 0 !important;
    display: flex !important; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding: 3px 0 !important; min-height: 46px;
    font-size: 10.5px !important; font-weight: 600; letter-spacing: 0;
    color: #8b95a7; text-decoration: none; position: relative;
  }
  .mobile-nav-item .icon { font-size: 20px !important; line-height: 1.1; }
  .mobile-nav-item.active { color: #6366f1 !important; }
  .mobile-nav-item.active::before {
    content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 20px; height: 3px; border-radius: 0 0 3px 3px; background: #6366f1;
  }
  /* mobile.html 自有 bottom-nav 也均分 */
  .bottom-nav .nav-item { flex: 1 1 0; min-width: 0 !important; padding: 6px 0 !important; }
  .bottom-nav .nav-item .icon { font-size: 20px; }
  .bottom-nav .nav-item .label { font-size: 10.5px; }
}
/* 超窄屏（iPhone SE / 小屏安卓）进一步收敛 */
@media (max-width: 390px) {
  .header h1 { font-size: 17px !important; }
  .mobile-nav-item { font-size: 10px !important; }
  .mobile-nav-item .icon { font-size: 19px !important; }
  th, td { padding-left: 4px !important; padding-right: 4px !important; }
}

/* ===== MOBILE APP UI v3.1 表格横滑 ===== */
@media (max-width: 768px) {
  .m-table-scroll {
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
    margin: 0 -2px;
    padding: 0 2px;
  }
  .m-table-scroll table { min-width: 100%; }
  .m-table-scroll::-webkit-scrollbar { height: 4px; }
  .m-table-scroll::-webkit-scrollbar-thumb { background: rgba(120,130,150,0.45); border-radius: 2px; }
}

#ast-mobile-css { display: none; }

@media (max-width: 768px) {
  input, select, textarea { font-size: 16px !important; }

<body>
<div class="container">
    <div class="header">
        <div>
            <h1>持仓管理 <span class="sub">实时盈亏 · 交易记录</span></h1>
        </div>
        <div class="header-right">
            <span id="updateTime" style="font-size:12px;color:var(--text-sec)">更新中...</span>
            <button class="btn" onclick="refreshPrices()">🔄 刷新行情</button>
            <button class="btn btn-primary" onclick="openAddModal()">➕ 添加持仓</button>
        </div>
    </div>

    <div class="asset-overview">
        <div class="asset-main">
            <div class="asset-total">
                <div class="label">总资产</div>
                <div class="value" id="totalAsset">¥0.00</div>
                <div class="change" id="totalChange">--</div>
            </div>
        </div>
        <div class="asset-details">
            <div class="asset-item"><div class="label">可用资金</div><div class="value" id="cash">¥100,000.00</div></div>
            <div class="asset-item"><div class="label">持仓市值</div><div class="value" id="marketValue">¥0.00</div></div>
            <div class="asset-item"><div class="label">持仓成本</div><div class="value" id="totalCost">¥0.00</div></div>
            <div class="asset-item"><div class="label">浮动盈亏</div><div class="value" id="floatPnl">--</div></div>
            <div class="asset-item"><div class="label">已实现盈亏</div><div class="value" id="realizedPnl">¥0.00</div></div>
            <div class="asset-item"><div class="label">持仓只数</div><div class="value" id="positionCount">0 只</div></div>
            <div class="asset-item"><div class="label">今日盈亏</div><div class="value" id="todayPnl">--</div></div>
            <div class="asset-item"><div class="label">仓位</div><div class="value" id="positionRatio">0%</div></div>
        </div>
    </div>

    <div class="chart-row">
        <div class="chart-card">
            <h3>持仓分布（市值）</h3>
            <canvas id="pieChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>个股盈亏</h3>
            <canvas id="profitChart"></canvas>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" data-tab="positions">当前持仓 (<span id="posCount">0</span>)</button>
        <button class="tab-btn" data-tab="trades">交易记录 (<span id="tradeCount">0</span>)</button>
    </div>

    <div class="tab-content active" id="tab-positions">
        <table id="positionTable">
            <thead>
                <tr>
                    <th>代码</th><th>名称</th><th class="num">持仓</th><th class="num">成本价</th>
                    <th class="num">现价</th><th class="num">市值</th><th class="num">盈亏</th>
                    <th class="num">盈亏%</th><th class="num">操作</th>
                </tr>
            </thead>
            <tbody id="positionBody"></tbody>
                </table>
                <div class="mobile-positions" id="mobilePositions"></div>
        </table>
        <div class="empty-state" id="positionEmpty" style="display:none">
            <div class="icon">📊</div>
            <div class="text">暂无持仓</div>
            <div class="hint">点击右上角"添加持仓"开始跟踪</div>
            <button class="btn btn-primary" onclick="openAddModal()">添加持仓</button>
        </div>
    </div>

    <div class="tab-content" id="tab-trades">
        <table id="tradeTable">
            <thead>
                <tr><th>时间</th><th>代码</th><th>名称</th><th>类型</th><th class="num">价格</th><th class="num">数量</th><th class="num">金额</th></tr>
            </thead>
            <tbody id="tradeBody"></tbody>
        </table>
        <div class="empty-state" id="tradeEmpty" style="display:none">
            <div class="icon">📝</div>
            <div class="text">暂无交易记录</div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal">
        <h3>添加持仓</h3>
        <div class="form-group">
            <label>股票代码</label>
            <input type="text" id="inputCode" placeholder="如：600519" maxlength="6">
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>买入价格</label>
                <input type="number" id="inputPrice" placeholder="0.00" step="0.01">
            </div>
            <div class="form-group">
                <label>持仓数量</label>
                <input type="number" id="inputShares" placeholder="100" step="100">
            </div>
        </div>
        <div class="form-group">
            <label>买入日期</label>
            <input type="date" id="inputDate">
        </div>
        <div class="modal-actions">
            <button class="btn" onclick="closeAddModal()">取消</button>
            <button class="btn btn-primary" onclick="addPosition()">确认添加</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const STORAGE_KEY = 'astock_positions';
const TRADE_KEY = 'astock_trades';
const CASH_KEY = 'astock_cash';
const INITIAL_CASH = 100000;

let positions = [];
let trades = [];
let cash = INITIAL_CASH;
let priceCache = {};

function loadData() {
    try {
        positions = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        trades = JSON.parse(localStorage.getItem(TRADE_KEY)) || [];
        cash = parseFloat(localStorage.getItem(CASH_KEY)) || INITIAL_CASH;
    } catch(e) { positions = []; trades = []; cash = INITIAL_CASH; }
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(positions));
    localStorage.setItem(TRADE_KEY, JSON.stringify(trades));
    localStorage.setItem(CASH_KEY, cash.toString());
}


function openAddModal() {
    document.getElementById('addModal').classList.add('active');
    document.getElementById('inputCode').value = '';
    document.getElementById('inputPrice').value = '';
    document.getElementById('inputShares').value = '';
    document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('inputCode').focus();
}

function closeAddModal() {
    document.getElementById('addModal').classList.remove('active');
}

function addPosition() {
    const code = document.getElementById('inputCode').value.trim();
    const price = parseFloat(document.getElementById('inputPrice').value);
    const shares = parseInt(document.getElementById('inputShares').value);
    const date = document.getElementById('inputDate').value;

    if (!code || code.length !== 6) { showToast('请输入6位股票代码', 'error'); return; }
    if (!price || price <= 0) { showToast('请输入有效价格', 'error'); return; }
    if (!shares || shares <= 0) { showToast('请输入有效数量', 'error'); return; }

    const cost = price * shares;
    if (cost > cash) { showToast('可用资金不足', 'error'); return; }

    const existing = positions.find(p => p.code === code);
    if (existing) {
        const totalCost = existing.cost * existing.shares + cost;
        const totalShares = existing.shares + shares;
        existing.cost = totalCost / totalShares;
        existing.shares = totalShares;
    } else {
        positions.push({ code, name: code, cost, shares, date });
    }

    cash -= cost;
    trades.unshift({ time: new Date().toLocaleString(), code, name: code, type: 'buy', price, shares, amount: cost, date });

    saveData();
    closeAddModal();
    fetchStockName(code);
    render();
    showToast('持仓添加成功');
}

async function sellPosition(code) {
    const pos = positions.find(p => p.code === code);
    if (!pos) return;
    const __cur = priceCache[code] || pos.cost;
    const __dlg = await appDialog({
        title: '卖出 ' + pos.name,
        msg: '持仓 ' + pos.shares + ' 股 · 成本 ' + pos.cost.toFixed(2) +
             '\n现价 ' + __cur.toFixed(2) + ' · 市值 ' + (__cur * pos.shares).toFixed(0),
        input: true, quick: true, max: pos.shares,
        value: String(pos.shares), okText: '确认卖出'
    });
    if (!__dlg.ok) return;
    const sellShares = parseInt(__dlg.value);
    if (!sellShares || sellShares <= 0) return;
    if (sellShares > pos.shares) { showToast('卖出数量超过持仓', 'error'); return; }

    const sellPrice = priceCache[code] || pos.cost;
    const amount = sellPrice * sellShares;
    const pnl = (sellPrice - pos.cost) * sellShares;

    cash += amount;
    pos.shares -= sellShares;
    if (pos.shares <= 0) {
        positions = positions.filter(p => p.code !== code);
    }

    trades.unshift({ time: new Date().toLocaleString(), code, name: pos.name, type: 'sell', price: sellPrice, shares: sellShares, amount, pnl });
    saveData();
    render();
    showToast(`卖出成功，盈亏: ${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}`);
}

async function deletePosition(code) {
    if (!(await appConfirm('删除持仓', '确定删除该持仓记录吗？（不影响资金）', true))) return;
    positions = positions.filter(p => p.code !== code);
    saveData();
    render();
    showToast('已删除');
}

async function fetchStockName(code) {
    try {
        const secid = (code.startsWith('6') ? '1.' : '0.') + code;
        const resp = await fetch(`https://push2delay.eastmoney.com/api/qt/stock/get?secid=${secid}&fields=f58`);
        const data = await resp.json();
        if (data?.data?.f58) {
            const pos = positions.find(p => p.code === code);
            if (pos) { pos.name = data.data.f58; saveData(); render(); }
            const trade = trades.find(t => t.code === code);
            if (trade && trade.name === code) { trade.name = data.data.f58; saveData(); }
        }
    } catch(e) {}
}

async function fetchPrices() {
    if (positions.length === 0) return;
    const codes = positions.map(p => (p.code.startsWith('6') ? '1.' : '0.') + p.code).join(',');
    try {
        const resp = await fetch(`https://push2delay.eastmoney.com/api/qt/ulist.np/get?secids=${codes}&fields=f2,f3,f12,f14`);
        const data = await resp.json();
        if (data?.data?.diff) {
            data.data.diff.forEach(item => {
                priceCache[item.f12] = item.f2;
                const pos = positions.find(p => p.code === item.f12);
                if (pos && item.f14) { pos.name = item.f14; }
            });
            saveData();
        }
    } catch(e) { console.error('行情获取失败', e); }
}

async function refreshPrices() {
    document.getElementById('updateTime').textContent = '更新中...';
    await fetchPrices();
    render();
    document.getElementById('updateTime').textContent = '更新于 ' + new Date().toLocaleTimeString();
    showToast('行情已刷新');
}

function render() {
    let marketValue = 0, totalCost = 0, floatPnl = 0;
    const pieData = [], profitData = [];

    positions.forEach(pos => {
        const price = priceCache[pos.code] || pos.cost;
        const value = price * pos.shares;
        const cost = pos.cost * pos.shares;
        const pnl = value - cost;
        marketValue += value;
        totalCost += cost;
        floatPnl += pnl;
        pieData.push({ name: pos.name, value });
        profitData.push({ name: pos.name, value: (pnl / cost * 100) });
    });

    const totalAsset = cash + marketValue;
    const totalPnl = totalAsset - INITIAL_CASH;
    const pnlPercent = (totalPnl / INITIAL_CASH * 100);

    document.getElementById('totalAsset').textContent = '¥' + totalAsset.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('totalChange').textContent = `${totalPnl >= 0 ? '+' : ''}${totalPnl.toFixed(2)} (${pnlPercent >= 0 ? '+' : ''}${pnlPercent.toFixed(2)}%)`;
    document.getElementById('totalChange').className = 'change ' + (totalPnl >= 0 ? 'up' : 'down');
    document.getElementById('cash').textContent = '¥' + cash.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('marketValue').textContent = '¥' + marketValue.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('totalCost').textContent = '¥' + totalCost.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    document.getElementById('floatPnl').textContent = `${floatPnl >= 0 ? '+' : ''}¥${floatPnl.toFixed(2)}`;
    document.getElementById('floatPnl').className = 'value ' + (floatPnl >= 0 ? 'up' : 'down');
    document.getElementById('positionCount').textContent = positions.length + ' 只';
    document.getElementById('positionRatio').textContent = marketValue > 0 ? (marketValue / totalAsset * 100).toFixed(1) + '%' : '0%';

    const realizedPnl = trades.filter(t => t.type === 'sell').reduce((sum, t) => sum + (t.pnl || 0), 0);
    document.getElementById('realizedPnl').textContent = `${realizedPnl >= 0 ? '+' : ''}¥${realizedPnl.toFixed(2)}`;
    document.getElementById('realizedPnl').className = 'value ' + (realizedPnl >= 0 ? 'up' : 'down');
    document.getElementById('todayPnl').textContent = '--';

    document.getElementById('posCount').textContent = positions.length;
    document.getElementById('tradeCount').textContent = trades.length;

    const tbody = document.getElementById('positionBody');
    const empty = document.getElementById('positionEmpty');
    if (positions.length === 0) {
        tbody.innerHTML = '';
        empty.style.display = 'block';
        document.getElementById('positionTable').style.display = 'none';
    } else {
        empty.style.display = 'none';
        document.getElementById('positionTable').style.display = 'table';
        tbody.innerHTML = positions.map(pos => {
            const price = priceCache[pos.code] || pos.cost;
            const value = price * pos.shares;
            const cost = pos.cost * pos.shares;
            const pnl = value - cost;
            const pnlPct = cost > 0 ? (pnl / cost * 100) : 0;
            const cls = pnl >= 0 ? 'up' : 'down';
            return `<tr>
                <td class="code">${pos.code}</td>
                <td class="name">${pos.name}</td>
                <td class="num">${pos.shares}</td>
                <td class="num">${pos.cost.toFixed(2)}</td>
                <td class="num">${price.toFixed(2)}</td>
                <td class="num">${value.toFixed(2)}</td>
                <td class="num ${cls}">${pnl >= 0 ? '+' : ''}${pnl.toFixed(2)}</td>
                <td class="num ${cls}">${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%</td>
                <td class="num">
                    <button class="btn" style="padding:4px 10px;font-size:12px" onclick="sellPosition('${pos.code}')">卖出</button>
                    <button class="btn btn-danger" style="padding:4px 10px;font-size:12px" onclick="deletePosition('${pos.code}')">删除</button>
                </td>
            </tr>`;
        }).join('');
    }

    const tradeBody = document.getElementById('tradeBody');
    const tradeEmpty = document.getElementById('tradeEmpty');
    if (trades.length === 0) {
        tradeBody.innerHTML = '';
        tradeEmpty.style.display = 'block';
        document.getElementById('tradeTable').style.display = 'none';
    } else {
        tradeEmpty.style.display = 'none';
        document.getElementById('tradeTable').style.display = 'table';
        tradeBody.innerHTML = trades.map(t => {
            const tagCls = t.type === 'buy' ? 'buy' : 'sell';
            const tagText = t.type === 'buy' ? '买入' : '卖出';
            return `<tr>
                <td style="font-size:12px;color:var(--text-sec)">${t.time}</td>
                <td class="code">${t.code}</td>
                <td class="name">${t.name}</td>
                <td><span class="trade-tag ${tagCls}" style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;background:${t.type==='buy'?'rgba(255,77,79,0.15)':'rgba(82,196,26,0.12)'};color:${t.type==='buy'?'var(--up)':'var(--down)'}">${tagText}</span></td>
                <td class="num">${t.price.toFixed(2)}</td>
                <td class="num">${t.shares}</td>
                <td class="num">${t.amount.toFixed(2)}</td>
            </tr>`;
        }).join('');
    }

    drawPieChart(pieData);
    drawProfitChart(profitData);
}

function drawPieChart(data) {
    const canvas = document.getElementById('pieChart');
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = 200 * 2;
    ctx.scale(2, 2);
    ctx.clearRect(0, 0, W/2, H/2);

    if (data.length === 0) {
        ctx.fillStyle = '#8b95a7';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无持仓数据', W/4, H/4);
        return;
    }

    const total = data.reduce((s, d) => s + d.value, 0);
    const colors = ['#6366f1', '#ff4d4f', '#52c41a', '#faad14', '#13c2c2', '#722ed1', '#eb2f96', '#fa8c16'];
    const cx = W/4, cy = H/4, r = 70, rInner = 40;
    let startAngle = -Math.PI / 2;

    data.forEach((d, i) => {
        const angle = (d.value / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, startAngle, startAngle + angle);
        ctx.arc(cx, cy, rInner, startAngle + angle, startAngle, true);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        startAngle += angle;
    });

    ctx.fillStyle = '#e0e6ed';
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('¥' + (total/10000).toFixed(2) + '万', cx, cy + 5);
    ctx.fillStyle = '#8b95a7';
    ctx.font = '11px sans-serif';
    ctx.fillText('总市值', cx, cy + 22);
}

function drawProfitChart(data) {
    const canvas = document.getElementById('profitChart');
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = 200 * 2;
    ctx.scale(2, 2);
    ctx.clearRect(0, 0, W/2, H/2);

    if (data.length === 0) {
        ctx.fillStyle = '#8b95a7';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无盈亏数据', W/4, H/4);
        return;
    }

    const maxVal = Math.max(...data.map(d => Math.abs(d.value)), 1);
    const barW = Math.min(40, (W/2 - 40) / data.length - 10);
    const startX = 20;
    const zeroY = H/4 - 30;
    const scale = (H/4 - 50) / maxVal;

    ctx.strokeStyle = '#2a3142';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, zeroY);
    ctx.lineTo(W/2, zeroY);
    ctx.stroke();

    data.forEach((d, i) => {
        const x = startX + i * (barW + 10) + barW/2;
        const h = Math.abs(d.value) * scale;
        const y = d.value >= 0 ? zeroY - h : zeroY;
        ctx.fillStyle = d.value >= 0 ? '#ff4d4f' : '#52c41a';
        ctx.fillRect(x - barW/2, y, barW, h);
        ctx.fillStyle = '#8b95a7';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(d.name.substring(0,4), x, H/4 - 8);
    });
}

(function (global) {

  }
  NetworkError.prototype = Object.create(Error.prototype);

  function toastContainer() {
    var el = document.getElementById('toastContainer');
    if (el) return el;

    el.id = 'toastContainer';
    el.style.cssText = 'position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none';
    document.body.appendChild(el);

  function showToast(msg, type) {
    var container = toastContainer();
    var toast = document.createElement('div');
    toast.className = 'toast ' + (type || 'success');
    toast.textContent = String(msg);
    toast.style.cssText = 'background:#182231;color:#e6edf6;border:1px solid #2b3a4d;border-radius:6px;padding:9px 14px;font-size:13px;max-width:82vw;box-shadow:none';
    container.appendChild(toast);

  }

  var wrapBusy = false;
  function wrapTables() {
    if (wrapBusy || window.innerWidth > 768) return;
    wrapBusy = true;
    try {
      var tables = document.querySelectorAll('table');
      for (var i = 0; i < tables.length; i++) {
        var t = tables[i];
        if (!t.parentNode || t.parentNode.classList.contains('m-table-scroll')) continue;
        var w = document.createElement('div');
        w.className = 'm-table-scroll';
        w.style.cssText = 'overflow-x:auto;-webkit-overflow-scrolling:touch';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      }
    } finally {
      wrapBusy = false;
    }
  }

  function get(key, fallback) {
    try {
      var raw = global.localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  function set(key, value) {
    try {
      global.localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }

  function fetchJSON(url, options) {
    options = options || {};
    var timeout = options.timeout || 8000;
    var retries = options.retries === undefined ? 1 : options.retries;
    var attempt = 0;
    function once() {
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeout) : null;
      var init = Object.assign({}, options.init || {});
      if (ctrl) init.signal = ctrl.signal;
      return global.fetch(url, init).then(function (resp) {
        if (timer) clearTimeout(timer);
        if (!resp.ok) throw new NetworkError(url + ' HTTP ' + resp.status);
        return resp.json();
      }).catch(function (err) {
        if (timer) clearTimeout(timer);
        if (attempt++ < retries) return once();
        throw new NetworkError(url + ' ' + (err && err.message ? err.message : '请求失败'));
      });
    }
    return once();
  }

  function reportFailure(area, err, fallbackText) {
    var msg = (area || '数据') + '不可用：' + (err && err.message ? err.message : String(err));
    showToast(msg, 'error');
    if (fallbackText) showToast(fallbackText, 'info');

  function calcTechScore(count) {

  function formatPct(value) {

  function compareVersions(a, b) {
    function parts(v) {
      return String(v == null ? '' : v).replace(/^v/i, '').split(/[.\-]/)
        .map(function (x) { var n = parseInt(x, 10); return isFinite(n) ? n : 0; });
    }
    var pa = parts(a), pb = parts(b);
    var len = Math.max(pa.length, pb.length);
    for (var i = 0; i < len; i++) {
      var x = pa[i] || 0, y = pb[i] || 0;
      if (x > y) return 1;

    if (!local) {
      var badge = document.querySelector('.header-badge');
      local = (badge && badge.textContent || '').replace(/^v/i, '').trim();
    }
    if (!local && options.useAppVersion && global.APP_VERSION) local = global.APP_VERSION;
    var url = options.url || updateURL();
    var script = document.createElement('script');
    var settled = false;
    var timer = setTimeout(function () { finish(new Error('版本检查超时')); }, options.timeout || 6000);

    function finish(err) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (script.parentNode) script.parentNode.removeChild(script);
      var release = global.ASTOCK_RELEASE;
      if (err) {
        if (options.onError) options.onError(err);
        return;
      }
      if (!release || !release.version) {
        if (options.onError) options.onError(new Error('版本清单无效'));
        return;
      }
      if (options.onRelease) options.onRelease(release);
      if (compareVersions(release.version, local) > 0) {
        if (options.onUpdate) options.onUpdate(release, local);
      } else if (options.onCurrent) {
        options.onCurrent(release, local);
      }
    }

    global.ASTOCK_RELEASE = undefined;
    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
    script.onload = function () { finish(); };
    script.onerror = function () { finish(new Error('版本清单加载失败')); };
    (document.head || document.body).appendChild(script);
  }

  function showUpdateBanner(release, options) {
    options = options || {};
    var id = 'ast-update-banner';
    var old = document.getElementById(id);
    if (old && old.parentNode) old.parentNode.removeChild(old);
    var box = document.createElement('div');
    box.id = id;
    box.setAttribute('role', 'status');
    box.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(8px + env(safe-area-inset-top,0px));z-index:100000;background:#1b2740;color:#e6edf6;border:1px solid #3b82f6;border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:13px';
    var text = document.createElement('div');
    text.style.cssText = 'flex:1;line-height:1.5';
    text.textContent = '发现新版本 v' + release.version + (release.notes ? '：' + release.notes : '');
    var btn = document.createElement('a');
    btn.textContent = '下载更新';
    btn.href = release.apk || release.page || updateURL();
    btn.style.cssText = 'flex:none;background:#3b82f6;color:#fff;border-radius:6px;padding:6px 12px;text-decoration:none;white-space:nowrap';
    var close = document.createElement('button');
    close.type = 'button';
    close.textContent = '×';
    close.setAttribute('aria-label', '关闭更新提示');
    close.style.cssText = 'flex:none;background:transparent;color:#94a3b8;border:0;font-size:18px;line-height:1;cursor:pointer';
    close.onclick = function () { if (box.parentNode) box.parentNode.removeChild(box); };
    box.appendChild(text);
    box.appendChild(btn);
    box.appendChild(close);
    (document.body || document.documentElement).appendChild(box);
    if (options.onShow) options.onShow(box);
    return box;
  }

  // 防骚扰记忆：用户点“稍后再说”后，记住该版本，本次安装内不再重复弹窗。
  var SKIP_KEY = 'astock_update_skipped';
  function skippedVersion() {
    try { return global.localStorage && global.localStorage.getItem(SKIP_KEY) || ''; }
    catch (e) { return ''; }
  }
  function rememberSkip(version) {
    try { if (global.localStorage) global.localStorage.setItem(SKIP_KEY, version); }
    catch (e) { /* 隐私模式/沙箱下忽略 */ }
  }
  function clearSkip() {
    try { if (global.localStorage) global.localStorage.removeItem(SKIP_KEY); }
    catch (e) { /* 忽略 */ }
  }

  // 启动时模态更新弹窗：显示版本号、更新说明、下载按钮。
  function showUpdateDialog(release, options) {
    options = options || {};
    var id = 'ast-update-dialog';
    var old = document.getElementById(id);
    if (old && old.parentNode) old.parentNode.removeChild(old);

    var mask = document.createElement('div');
    mask.id = id;
    mask.setAttribute('role', 'dialog');
    mask.setAttribute('aria-modal', 'true');
    mask.style.cssText = 'position:fixed;inset:0;z-index:200000;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;padding:24px';

    var card = document.createElement('div');
    card.style.cssText = 'width:100%;max-width:360px;background:#1a1f2e;color:#e0e6ed;border:1px solid #2a3142;border-radius:16px;padding:22px 20px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5)';

    var title = document.createElement('div');
    title.style.cssText = 'font-size:17px;font-weight:700;margin-bottom:6px';
    title.textContent = '发现新版本 v' + release.version;

    var sub = document.createElement('div');
    sub.style.cssText = 'font-size:12px;color:#8b95a7;margin-bottom:12px';
    sub.textContent = '当前版本 v' + (options.localVersion || currentVersion());

    var notes = document.createElement('div');
    notes.style.cssText = 'font-size:13px;line-height:1.65;color:#c3cbd8;background:rgba(99,102,241,.1);border-radius:10px;padding:10px 12px;margin-bottom:18px;white-space:pre-wrap';
    notes.textContent = release.notes || '优化了稳定性与体验，建议更新。';

    var actions = document.createElement('div');
    actions.style.cssText = 'display:flex;gap:10px';

    var later = document.createElement('button');
    later.type = 'button';
    later.textContent = '稍后再说';
    later.style.cssText = 'flex:1;background:transparent;color:#8b95a7;border:1px solid #2a3142;border-radius:9px;padding:11px;font-size:14px;cursor:pointer';
    later.onclick = function () {
      rememberSkip(release.version);
      if (mask.parentNode) mask.parentNode.removeChild(mask);
      if (options.onLater) options.onLater();
    };

    var download = document.createElement('a');
    download.textContent = '立即下载';
    download.href = release.apk || release.page || updateURL();
    download.setAttribute('download', '');
    download.style.cssText = 'flex:1;text-align:center;background:#6366f1;color:#fff;border-radius:9px;padding:11px;font-size:14px;text-decoration:none;font-weight:600';
    download.onclick = function () {
      clearSkip();
      if (options.onDownload) options.onDownload();
    };

    actions.appendChild(later);
    actions.appendChild(download);
    card.appendChild(title);
    card.appendChild(sub);
    card.appendChild(notes);
    card.appendChild(actions);
    mask.appendChild(card);
    mask.onclick = function (e) { if (e.target === mask) later.onclick(); };
    (document.body || document.documentElement).appendChild(mask);
    if (options.onShow) options.onShow(mask);
    return mask;
  }

  // 统一入口：APK 与 PWA 打开时都检查；发现新版本弹模态框，尊重“稍后”记忆。
  function maybeCheckUpdate(options) {
    options = options || {};
    checkUpdate({
      localVersion: options.localVersion || global.APP_VERSION,
      useAppVersion: true,
      timeout: options.timeout || 8000,
      onRelease: options.onRelease,
      onUpdate: function (release, local) {
        if (skippedVersion() === release.version) return;
        showUpdateDialog(release, {
          localVersion: local,
          onDownload: options.onDownload,
          onLater: options.onLater
        });
      },
      onError: options.onError || function () {}
    });
  }

  // 手动检查：忽略“稍后”记忆，无新版本时给出明确反馈。
  function checkUpdateNow() {
    clearSkip();
    maybeCheckUpdate({
      localVersion: global.APP_VERSION,
      onError: function () {
        if (global.showToast) showToast('检查失败，请确认网络后重试', 'error');
      },
      onRelease: function (release) {
        if (compareVersions(release.version, currentVersion()) <= 0 &&
            global.showToast) showToast('已是最新版本 v' + release.version, 'success');
      }
    });
  }

  function registerServiceWorker(options) {
    options = options || {};
    if (typeof navigator === 'undefined' || !navigator.serviceWorker ||
        /^file:/i.test(location.protocol)) return Promise.resolve(null);
    var notified = false;
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (notified || !hadController) return;
      notified = true;
      if (options.onUpdate) options.onUpdate();
    });
    return navigator.serviceWorker.register(options.script || './service-worker.js',
      options.scope ? { scope: options.scope } : undefined).catch(function () { return null; });
  }

  function currentVersion() {
    // 本地版本优先：APK 由 gen_assets 注入，PWA 由构建脚本注入。
    // 线上清单只作兜底，避免把“当前版本”错显示成可升级的最新版。
    return global.APP_VERSION || (global.ASTOCK_RELEASE && global.ASTOCK_RELEASE.version) || '';
  }

  // 单一真相源：把所有 [data-app-version] 元素填充为当前版本，
  // 避免页面内硬编码版本与 VERSION 不一致（旧版本残留在“关于”弹层）。
  function syncVersionLabels() {
    var v = currentVersion();
    if (!v) return;
    var nodes = document.querySelectorAll('[data-app-version]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = 'v' + v;
  }

  function initUpdateChecks() {
    syncVersionLabels();
    // APK 与 PWA 打开时都检查版本：新版本上传后，用户进入应用即弹下载提示。
    maybeCheckUpdate({
      localVersion: global.APP_VERSION,
      onError: function () { /* 离线时静默降级，不影响离线使用 */ }
    });
    registerServiceWorker({
      onUpdate: function () {
        // 版本弹窗已负责提示下载；这里只提示网页版缓存已更新，避免重复 confirm。
        showToast('网页版本已更新，刷新后生效', 'info');
      }
    });
  }

  var memoStore = {};
  function memo(key, ttl, loader) {
    var hit = memoStore[key];
    var now = Date.now();
    if (hit && now - hit.time < ttl) return Promise.resolve(hit.value);
    return Promise.resolve().then(loader).then(function (value) {
      memoStore[key] = { time: Date.now(), value: value };
      return value;
    });
  }

  function clearMemo() { memoStore = {}; }

  function batchRun(items, worker, options) {
    options = options || {};
    var size = options.size || 5;
    var delay = options.delay || 0;
    var results = [];
    var index = 0;
    function next() {
      if (index >= items.length) return Promise.resolve(results);
      var batch = items.slice(index, index + size);
      index += size;
      return Promise.all(batch.map(function (item, i) {
        return Promise.resolve().then(function () { return worker(item, i); })
          .catch(function (e) { return { error: e && e.message ? e.message : String(e) }; });
      })).then(function (values) {
        results = results.concat(values);
        if (options.onProgress) options.onProgress(results.length, items.length);
        if (delay && index < items.length) {
          return new Promise(function (resolve) { setTimeout(resolve, delay); });
        }
      }).then(next);
    }
    return next();
  }

  /* ---------- 全市场行情：本地 API 优先，GitHub Pages 用跨域脚本兜底 ---------- */
  var jsonpSeq = 0;
  function loadScript(url, charset, key, timeout) {
    return new Promise(function (resolve, reject) {
      var script = document.createElement('script');
      var settled = false;
      var timer = setTimeout(function () { finish(new Error('script timeout')); }, timeout || 8000);
      function finish(err) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (script.parentNode) script.parentNode.removeChild(script);
        if (err) { reject(err); return; }
        // 不在这里清理变量：同一个脚本可能定义多个 v_xxx，由调用方读取后统一删除。
        var value = key ? global[key] : undefined;
        resolve(value);
      }
      script.src = url;
      if (charset) script.charset = charset;
      script.onload = function () { finish(); };
      script.onerror = function () { finish(new Error('script load failed')); };
      (document.head || document.body).appendChild(script);
    });
  }

  function normalizeSymbol(raw) {
    var value = String(raw == null ? '' : raw).trim().toUpperCase();
    if (!value) return null;
    if (value.indexOf('HS_') === 0) {
      var c = value.slice(3);
      value = (/^[695]/.test(c) ? '1.' : '0.') + c;
    }
    var m;
    if ((m = /^(\d{1,3})\.([A-Z0-9]{1,10})$/.exec(value))) {
      var no = m[1], code = m[2];
      if (no === '1' || no === '0') {
        return { symbol: (no === '1' ? 'sh' : 'sz') + code, code: code,
                 secid: no + '.' + code, market: 'CN', tencent: (no === '1' ? 'sh' : 'sz') + code };
      }
      if (no === '116') {
        return { symbol: 'hk' + code, code: code, secid: no + '.' + code,
                 market: 'HK', tencent: 'hk' + code };
      }
      if (no === '105' || no === '106' || no === '107' || no === '100') {
        return { symbol: 'us' + code, code: code, secid: no + '.' + code,
                 market: 'US', tencent: 'us' + code };
      }
      return null;
    }
    if ((m = /^(SH|SZ|BJ|HK|US)([A-Z0-9]{1,10})$/.exec(value))) {
      var p = m[1], v = m[2];
      if (p === 'SH' || p === 'SZ' || p === 'BJ') {
        var mk = /^[695]/.test(v) ? '1' : '0';
        return { symbol: p.toLowerCase() + v, code: v, secid: mk + '.' + v,
                 market: 'CN', tencent: p.toLowerCase() + v };
      }
      if (p === 'HK') {
        return { symbol: 'hk' + v, code: v, secid: '116.' + v, market: 'HK', tencent: 'hk' + v };
      }
      return { symbol: 'us' + v, code: v, secid: '105.' + v, market: 'US', tencent: 'us' + v };
    }
    if (/^\d{6}$/.test(value)) {
      var m6 = /^[695]/.test(value) ? '1' : '0';
      return { symbol: (m6 === '1' ? 'sh' : 'sz') + value, code: value,
               secid: m6 + '.' + value, market: 'CN', tencent: (m6 === '1' ? 'sh' : 'sz') + value };
    }
    if (/^\d{5}$/.test(value)) {
      return { symbol: 'hk' + value, code: value, secid: '116.' + value,
               market: 'HK', tencent: 'hk' + value };
    }
    if (/^[A-Z][A-Z0-9.\-]{0,9}$/.test(value)) {
      var idx = { NDX: '100.NDX', IXIC: '100.NDX', DJI: '100.DJIA', DJIA: '100.DJIA',
                  SPX: '100.SPX', INX: '100.SPX', VIX: '100.VIX' }[value] || ('105.' + value);
      return { symbol: 'us' + value, code: value, secid: idx, market: 'US', tencent: 'us' + value };
    }
    return null;
  }

  function apiBase() {
    return location.protocol === 'file:' ? '' : '';
  }

  function localApiAvailable() {
    return memo('ast_api_probe', 60000, function () {
      if (location.protocol === 'file:') return Promise.resolve(false);
      return fetchJSON(apiBase() + '/api/health', { timeout: 1500, retries: 0 })
        .then(function (d) { return !!(d && d.status === 'ok'); })
        .catch(function () { return false; });
    });
  }

  function num(value) {
    var n = parseFloat(value);
    return isFinite(n) ? n : 0;
  }

  function parseTencentQuote(raw, target) {
    var f = String(raw || '').split('~');
    if (f.length < 35) return null;
    var amount = num(f[37]);
    if (target.market === 'CN') amount *= 10000;
    var price = num(f[3]);
    if (!price) return null;
    return {
      symbol: target.symbol, code: target.code, name: f[1] || '', secid: target.secid,
      market: target.market, price: price, prev_close: num(f[4]), open: num(f[5]),
      volume: num(f[36]), amount: amount, change: num(f[31]), change_pct: num(f[32]),
      high: num(f[33]), low: num(f[34]), turnover: num(f[38]), pe: num(f[39]), pb: 0,
      total_mv: num(f[45]) * 1e8, time: f[30] || '', timestamp: 0,
      source: 'tencent', stale: false
    };
  }

  function fetchQuotes(symbols, options) {
    options = options || {};
    var list = (Array.isArray(symbols) ? symbols : [symbols]).map(normalizeSymbol).filter(Boolean);
    if (!list.length) return Promise.resolve([]);
    return localApiAvailable().then(function (available) {
      if (available && !options.skipApi) {
        return fetchJSON(apiBase() + '/api/quote?symbols=' +
          encodeURIComponent(list.map(function (t) { return t.symbol; }).join(',')),
          { timeout: 5000, retries: 0 }).then(function (d) {
            if (d && Array.isArray(d.quotes) && d.quotes.length) return d.quotes;
            throw new Error('empty quotes');
          }).catch(function () { return fetchQuotesScript(list); });
      }
      return fetchQuotesScript(list);
    });
  }

  function fetchQuotesScript(targets) {
    var out = [];
    var batches = [];
    for (var i = 0; i < targets.length; i += 60) batches.push(targets.slice(i, i + 60));
    return batches.reduce(function (chain, batch) {
      return chain.then(function (acc) {
        var keys = batch.map(function (t) { return 'v_' + t.tencent; });
        var url = 'https://qt.gtimg.cn/q=' + batch.map(function (t) { return t.tencent; }).join(',');
        return loadScript(url, 'GBK', keys[0], 8000).then(function () {
          batch.forEach(function (t, i) {
            var raw = global[keys[i]];
            var q = raw ? parseTencentQuote(raw, t) : null;
            if (q) acc.push(q);
            try { delete global[keys[i]]; } catch (e) { global[keys[i]] = undefined; }
          });
          return acc;
        }).catch(function () { return acc; });
      });
    }, Promise.resolve(out));
  }

  function searchSymbols(keyword, limit) {
    var q = String(keyword || '').trim();
    if (!q) return Promise.resolve([]);
    limit = limit || 8;
    return localApiAvailable().then(function (available) {
      if (available) {
        return fetchJSON(apiBase() + '/api/search?q=' + encodeURIComponent(q) +
          '&limit=' + limit, { timeout: 4000, retries: 0 })
          .then(function (d) { return (d && d.results) || []; })
          .catch(function () { return searchSymbolsScript(q, limit); });
      }
      return searchSymbolsScript(q, limit);
    });
  }

  function searchSymbolsScript(keyword, limit) {
    return loadScript('https://smartbox.gtimg.cn/s3/?q=' + encodeURIComponent(keyword) +
      '&t=all', 'GBK', 'v_hint', 6000).then(function (hint) {
        var results = [];
        String(hint || '').split('^').forEach(function (part) {
          var f = part.split('~');
          if (f.length < 3) return;
          var p = f[0], code = f[1], name = f[2];
          var symbol = '';
          if (p === 'sh' || p === 'sz') symbol = p + code;
          else if (p === 'hk') symbol = 'hk' + code;
          else if (p === 'us') symbol = 'us' + code.split('.')[0];
          if (!symbol) return;
          var t = normalizeSymbol(symbol);
          results.push({ symbol: symbol, code: code, name: name,
                         market: t ? t.market : 'US', secid: t ? t.secid : '' });
        });
        return results.slice(0, limit);
      }).catch(function () { return []; });
  }

  function getKline(symbol, days, options) {
    options = options || {};
    var t = normalizeSymbol(symbol);
    if (!t) return Promise.resolve([]);
    days = days || 80;
    return localApiAvailable().then(function (available) {
      if (available && !options.skipApi) {
        return fetchJSON(apiBase() + '/api/kline?secid=' + encodeURIComponent(t.secid) +
          '&days=' + days, { timeout: 6000, retries: 0 })
          .then(function (d) { return (d && d.klines) || []; })
          .catch(function () { return getKlineJsonp(t, days); });
      }
      return getKlineJsonp(t, days);
    });
  }

  function getKlineJsonp(target, days) {
    var cb = 'ast_kline_' + (++jsonpSeq) + '_' + Date.now();
    var url = 'https://push2his.eastmoney.com/api/qt/stock/kline/get?cb=' + cb +
      '&secid=' + encodeURIComponent(target.secid) +
      '&klt=101&fqt=1&end=20500101&lmt=' + days +
      '&fields1=f1,f2,f3,f4,f5&fields2=f51,f52,f53,f54,f55,f56,f57';
    return loadScript(url, 'utf-8', cb, 9000).then(function (payload) {
      return ((payload && payload.data && payload.data.klines) || []);
    }).catch(function () { return []; });
  }

  global.AST = {
    pages: PAGES,
    normalizeSymbol: normalizeSymbol,
    fetchQuotes: fetchQuotes,
    searchSymbols: searchSymbols,
    getKline: getKline,
    NetworkError: NetworkError,
    showToast: showToast,
    wrapTables: wrapTables,
    storage: { get: get, set: set },
    fetchJSON: fetchJSON,
    reportFailure: reportFailure,
    calcTechScore: calcTechScore,
    formatPct: formatPct,
    memo: memo,
    clearMemo: clearMemo,
    batchRun: batchRun,
    compareVersions: compareVersions,
    checkUpdate: checkUpdate,
    showUpdateBanner: showUpdateBanner,
    showUpdateDialog: showUpdateDialog,
    maybeCheckUpdate: maybeCheckUpdate,
    checkUpdateNow: checkUpdateNow,
    registerServiceWorker: registerServiceWorker,
    initUpdateChecks: initUpdateChecks,
    syncVersionLabels: syncVersionLabels,
    currentVersion: currentVersion
  };

  global.showToast = showToast;
  global.wrapTables = wrapTables;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initUpdateChecks);
  } else {
    initUpdateChecks();
  }
})(window);

</script>
<!-- AST_COMMON_END -->
</body>
</html>
