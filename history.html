<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>选股历史回顾 · A股智能选股系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0e1217; color: #e0e6ed; line-height: 1.6; font-size: 14px; min-height: 100vh;
}
:root {
    --bg: #0e1217; --card: #1a1f2e; --border: #2a3142; --text: #e0e6ed;
    --text-sec: #8b95a7; --up: #ff4d4f; --down: #52c41a; --flat: #8b95a7;
    --accent: #6366f1; --accent-light: rgba(99,102,241,0.15);
    --warn: #faad14;
}
.container { max-width: 1200px; margin: 0 auto; padding: 20px 24px 40px; }
.header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px;
}
.header h1 { font-size: 22px; font-weight: 700; }
.header .sub { font-size: 13px; color: var(--text-sec); margin-left: 8px; font-weight: 400; }
.header-right { display: flex; gap: 10px; }
.btn {
    padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer; font-size: 13px;
    transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); background: var(--accent-light); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-danger { color: var(--down); border-color: rgba(82,196,26,0.3); }

.stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px;
}
.stat-card .label { font-size: 12px; color: var(--text-sec); margin-bottom: 8px; }
.stat-card .value { font-size: 26px; font-weight: 700; font-family: "SF Mono", "Consolas", monospace; }
.stat-card .value.accent { color: var(--accent); }
.stat-card .value.up { color: var(--up); }
.stat-card .value.down { color: var(--down); }
.stat-card .value.warn { color: var(--warn); }

.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.chart-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px;
}
.chart-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--text-sec); }
.chart-card canvas { width: 100%; height: 220px; }

.section-title {
    font-size: 15px; font-weight: 600; color: var(--text-sec); margin: 24px 0 12px;
    display: flex; align-items: center; gap: 8px;
}
.section-title::before { content: ""; width: 3px; height: 16px; background: var(--accent); border-radius: 2px; }

.history-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 12px; overflow: hidden; transition: all 0.2s;
}
.history-item:hover { border-color: var(--accent); }
.history-header {
    padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;
}
.history-header:hover { background: rgba(99,102,241,0.05); }
.history-left { display: flex; align-items: center; gap: 16px; }
.history-date { font-size: 15px; font-weight: 600; font-family: "SF Mono", "Consolas", monospace; }
.history-strategy {
    padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600;
    background: var(--accent-light); color: var(--accent);
}
.history-count { font-size: 13px; color: var(--text-sec); }
.history-count .num { font-size: 18px; color: var(--accent); font-weight: 700; margin-right: 4px; }
.history-right { display: flex; align-items: center; gap: 10px; }
.expand-icon { font-size: 12px; color: var(--text-sec); transition: transform 0.2s; }
.history-item.expanded .expand-icon { transform: rotate(180deg); }

.history-detail {
    display: none; padding: 0 18px 16px; border-top: 1px solid var(--border);
}
.history-item.expanded .history-detail { display: block; }
.stock-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin-top: 14px;
}
.stock-chip {
    padding: 8px 12px; background: #141822; border: 1px solid var(--border);
    border-radius: 6px; display: flex; justify-content: space-between; align-items: center;
}
.stock-chip .name { font-weight: 600; font-size: 13px; }
.stock-chip .code { font-size: 11px; color: var(--text-sec); font-family: "Consolas", monospace; }
.stock-chip .score {
    font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px;
    background: var(--accent-light); color: var(--accent);
}

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-sec); }
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .text { font-size: 14px; margin-bottom: 4px; }
.empty-state .hint { font-size: 12px; opacity: 0.7; }

.toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; }
.toast {
    padding: 12px 20px; border-radius: 8px; margin-bottom: 8px;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font-size: 13px; animation: slideIn 0.3s ease;
}
.toast.success { border-color: rgba(82,196,26,0.5); }
.toast.error { border-color: rgba(255,77,79,0.5); }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

@media (max-width: 900px) {
    .stats-grid { grid-template-columns: repeat(3, 1fr); }
    .chart-row { grid-template-columns: 1fr; }
}

/* 移动端底部导航 */
.mobile-bottom-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(26,31,46,0.96); backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    justify-content: space-around;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 997;
}
.mobile-nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 16px; color: #8b95a7; text-decoration: none;
    font-size: 11px; font-weight: 600; min-width: 60px; min-height: 48px;
    justify-content: center; position: relative;
}
.mobile-nav-item .icon { font-size: 22px; }
.mobile-nav-item.active { color: #6366f1; }
.mobile-nav-item.active::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 24px; height: 3px; border-radius: 0 0 2px 2px; background: #6366f1;
}
@media (max-width: 768px) {  /* 全局：固定窗口，禁止横向溢出 */
  html, body {
    overflow-x: hidden;
    max-width: 100vw;
  }
  * { max-width: 100%; }
  img, canvas, svg { max-width: 100%; height: auto; }
  body { padding-bottom: 90px !important; }

    /* header纵向：标题占满一行，按钮换行 */
    .header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .header h1 { font-size: 18px; }
    .header .sub { display: block; margin-left: 0; margin-top: 4px; font-size: 11px; }
    .header-right { width: 100%; }
    .header-right .btn { flex: 1; text-align: center; }

    .stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px; }
    .stat-card { padding: 14px 10px; }
    .stat-value { font-size: 20px; }
    .btn { white-space: nowrap; padding: 8px 12px; font-size: 12px; }
    .container { padding-bottom: 90px; }
}

/* ===== MOBILE APP UI v3 —— 统一手机端框架（自动注入） ===== */
/* 平板/手机：底部 Tab 一律显示 */
@media (max-width: 768px) {
  .mobile-bottom-nav { display: flex !important; }
}
/* 触屏设备：触摸目标 >=44px，输入框 16px 防 iOS 自动缩放 */
@media (pointer: coarse) {
  button, .btn, .action-btn, .filter-toggle, .sector-tag, .quick-tag, .tab-btn,
  .mobile-nav-item, .nav-item, .menu-item { min-height: 44px; }
  input[type="text"], input[type="number"], input[type="search"], input[type="date"], select, textarea { font-size: 16px !important; }
}
/* 手机竖屏精细适配（覆盖 360–480px 主流机型） */
@media (max-width: 480px) {
  html { -webkit-text-size-adjust: 100%; }
  body { padding-left: 0 !important; padding-right: 0 !important; overflow-x: hidden; }
  .container, .main-layout, .content, .wrap, .page {
    padding-left: 12px !important; padding-right: 12px !important;
    max-width: 100vw !important;
  }
  .header { padding-top: calc(10px + env(safe-area-inset-top, 0px)) !important; }
  .header h1 { font-size: 18px !important; line-height: 1.3; }
  .header .sub, .header .subtitle { font-size: 11px !important; line-height: 1.45; }
  .stats-bar, .stats-grid, .summary-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px !important; }
  .card, .panel, .stat-card, .strategy-card, .alert-card, .position-card, .result-card, .menu-list {
    border-radius: 12px !important;
  }
  table { font-size: 12px !important; }
  th { font-size: 11px !important; padding: 8px 5px !important; }
  td { padding: 9px 5px !important; }
  button, .btn { font-size: 13px !important; min-height: 40px; }
  /* 底部 Tab：5 项均分，图标+文字，安全区留白 */
  .mobile-bottom-nav {
    display: flex !important;
    position: fixed; bottom: 0; left: 0; right: 0;
    align-items: stretch; justify-content: space-around;
    background: rgba(18,23,32,0.97);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,0.09);
    padding: 5px 2px calc(5px + env(safe-area-inset-bottom, 0px));
    z-index: 1000; box-shadow: 0 -6px 24px rgba(0,0,0,0.35);
  }
  .mobile-nav-item {
    flex: 1 1 0 !important; min-width: 0 !important;
    display: flex !important; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; padding: 3px 0 !important; min-height: 46px;
    font-size: 10.5px !important; font-weight: 600; letter-spacing: 0;
    color: #8b95a7; text-decoration: none; position: relative;
  }
  .mobile-nav-item .icon { font-size: 20px !important; line-height: 1.1; }
  .mobile-nav-item.active { color: #6366f1 !important; }
  .mobile-nav-item.active::before {
    content: ''; position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
    width: 20px; height: 3px; border-radius: 0 0 3px 3px; background: #6366f1;
  }
  /* mobile.html 自有 bottom-nav 也均分 */
  .bottom-nav .nav-item { flex: 1 1 0; min-width: 0 !important; padding: 6px 0 !important; }
  .bottom-nav .nav-item .icon { font-size: 20px; }
  .bottom-nav .nav-item .label { font-size: 10.5px; }
}
/* 超窄屏（iPhone SE / 小屏安卓）进一步收敛 */
@media (max-width: 390px) {
  .header h1 { font-size: 17px !important; }
  .mobile-nav-item { font-size: 10px !important; }
  .mobile-nav-item .icon { font-size: 19px !important; }
  th, td { padding-left: 4px !important; padding-right: 4px !important; }
}

<body>
<div class="container">
    <div class="header">
        <div>
            <h1>选股历史回顾 <span class="sub">五维共振 · 历史选股回溯</span></h1>
        </div>
        <div class="header-right">
            <button class="btn" onclick="exportHistory()">📥 导出CSV</button>
            <button class="btn btn-danger" onclick="clearHistory()">🗑️ 清空历史</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">选股次数</div>
            <div class="value accent" id="totalSessions">0</div>
        </div>
        <div class="stat-card">
            <div class="label">累计入选</div>
            <div class="value" id="totalPicks">0</div>
        </div>
        <div class="stat-card">
            <div class="label">日均入选</div>
            <div class="value" id="avgPicks">0</div>
        </div>
        <div class="stat-card">
            <div class="label">覆盖股票</div>
            <div class="value warn" id="uniqueStocks">0</div>
        </div>
        <div class="stat-card">
            <div class="label">最高入选</div>
            <div class="value up" id="maxPicks">0</div>
        </div>
        <div class="stat-card">
            <div class="label">最近选股</div>
            <div class="value" id="lastDate" style="font-size:16px">--</div>
        </div>
    </div>

    <div class="chart-row">
        <div class="chart-card">
            <h3>入选数量趋势</h3>
            <canvas id="trendChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>高频入选股票 TOP10</h3>
            <canvas id="freqChart"></canvas>
        </div>
    </div>

    <div class="section-title">历史记录</div>
    <div id="historyList"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const STORAGE_KEY = 'astock_selection_history';
let history = [];

function loadHistory() {
    try {
        history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) { history = []; }
}


function getStockList(item) {
    if (item.stocks && Array.isArray(item.stocks)) {
        return item.stocks.map(s => typeof s === 'string' ? {name: s, code: s} : {name: s.name || s.code, code: s.code || s.name, score: s.score});
    }
    return [];
}

function renderStats() {
    if (history.length === 0) return;

    const totalPicks = history.reduce((sum, item) => sum + (item.count || getStockList(item).length), 0);
    const allStocks = [];
    history.forEach(item => {
        getStockList(item).forEach(s => allStocks.push(s.code || s.name));
    });
    const uniqueStocks = new Set(allStocks).size;
    const maxPicks = Math.max(...history.map(item => item.count || getStockList(item).length));
    const dates = history.map(item => item.date || item.time || '').filter(d => d);
    const lastDate = dates[0] || '--';

    document.getElementById('totalSessions').textContent = history.length;
    document.getElementById('totalPicks').textContent = totalPicks;
    document.getElementById('avgPicks').textContent = (totalPicks / history.length).toFixed(1);
    document.getElementById('uniqueStocks').textContent = uniqueStocks;
    document.getElementById('maxPicks').textContent = maxPicks;
    document.getElementById('lastDate').textContent = lastDate.length > 10 ? lastDate.substring(0, 10) : lastDate;
}

function renderTrendChart() {
    const canvas = document.getElementById('trendChart');
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = 220 * 2;
    ctx.scale(2, 2);
    ctx.clearRect(0, 0, W/2, H/2);

    if (history.length === 0) {
        ctx.fillStyle = '#8b95a7';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无数据', W/4, H/4);
        return;
    }

    const data = history.slice(0, 20).reverse();
    const maxVal = Math.max(...data.map(d => d.count || getStockList(d).length), 1);
    const chartW = W/2 - 40, chartH = H/2 - 40;
    const barW = Math.min(30, chartW / data.length - 8);
    const startX = 30;

    ctx.strokeStyle = '#2a3142';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
        const y = 20 + (chartH / 4) * i;
        ctx.beginPath();
        ctx.moveTo(startX, y);
        ctx.lineTo(W/2 - 10, y);
        ctx.stroke();
    }

    data.forEach((item, i) => {
        const val = item.count || getStockList(item).length;
        const h = (val / maxVal) * chartH;
        const x = startX + i * (barW + 8) + barW/2;
        const y = 20 + chartH - h;

        const grad = ctx.createLinearGradient(x, y, x, 20 + chartH);
        grad.addColorStop(0, '#6366f1');
        grad.addColorStop(1, 'rgba(99,102,241,0.3)');
        ctx.fillStyle = grad;
        ctx.fillRect(x - barW/2, y, barW, h);

        ctx.fillStyle = '#e0e6ed';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(val, x, y - 5);

        ctx.fillStyle = '#8b95a7';
        ctx.font = '9px sans-serif';
        const date = (item.date || item.time || '').substring(5, 10);
        ctx.fillText(date, x, 20 + chartH + 14);
    });
}

function renderFreqChart() {
    const canvas = document.getElementById('freqChart');
    const ctx = canvas.getContext('2d');
    const W = canvas.width = canvas.offsetWidth * 2;
    const H = canvas.height = 220 * 2;
    ctx.scale(2, 2);
    ctx.clearRect(0, 0, W/2, H/2);

    if (history.length === 0) {
        ctx.fillStyle = '#8b95a7';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('暂无数据', W/4, H/4);
        return;
    }

    const freq = {};
    history.forEach(item => {
        getStockList(item).forEach(s => {
            const key = s.name || s.code;
            freq[key] = (freq[key] || 0) + 1;
        });
    });

    const sorted = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 10);
    if (sorted.length === 0) return;

    const maxVal = sorted[0][1];
    const barH = Math.min(16, (H/2 - 40) / sorted.length - 4);
    const startY = 20;

    sorted.forEach((item, i) => {
        const y = startY + i * (barH + 6);
        const w = (item[1] / maxVal) * (W/2 - 100);
        ctx.fillStyle = '#6366f1';
        ctx.fillRect(80, y, w, barH);
        ctx.fillStyle = '#e0e6ed';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(item[0].substring(0, 6), 75, y + barH/2 + 4);
        ctx.fillStyle = '#8b95a7';
        ctx.textAlign = 'left';
        ctx.fillText(item[1] + '次', 85 + w, y + barH/2 + 4);
    });
}

function renderHistory() {
    const container = document.getElementById('historyList');
    if (history.length === 0) {
        container.innerHTML = `<div class="empty-state">
            <div class="icon">📋</div>
            <div class="text">暂无选股历史记录</div>
            <div class="hint">使用智能选股器保存选股结果后，将在此处显示</div>
        </div>`;
        return;
    }

    container.innerHTML = history.map((item, idx) => {
        const stocks = getStockList(item);
        const count = item.count || stocks.length;
        const date = item.date || item.time || '--';
        const strategy = item.strategy || '五维共振';
        const stocksHtml = stocks.map(s => `
            <div class="stock-chip">
                <div>
                    <div class="name">${s.name || s.code}</div>
                    <div class="code">${s.code || ''}</div>
                </div>
                ${s.score ? `<div class="score">${s.score}</div>` : ''}
            </div>
        `).join('');

        return `<div class="history-item" data-idx="${idx}">
            <div class="history-header" onclick="toggleDetail(${idx})">
                <div class="history-left">
                    <span class="history-date">${date}</span>
                    <span class="history-strategy">${strategy}</span>
                </div>
                <div class="history-right">
                    <span class="history-count"><span class="num">${count}</span>只入选</span>
                    <span class="expand-icon">▼</span>
                </div>
            </div>
            <div class="history-detail">
                <div class="stock-grid">${stocksHtml}</div>
            </div>
        </div>`;
    }).join('');
}

function toggleDetail(idx) {
    const item = document.querySelector(`.history-item[data-idx="${idx}"]`);
    if (item) item.classList.toggle('expanded');
}

function exportHistory() {
    if (history.length === 0) { showToast('暂无历史记录', 'error'); return; }
    let csv = '日期,策略,股票代码,股票名称,评分\n';
    history.forEach(item => {
        const date = item.date || item.time || '';
        const strategy = item.strategy || '五维共振';
        getStockList(item).forEach(s => {
            csv += `${date},${strategy},${s.code || ''},${s.name || ''},${s.score || ''}\n`;
        });
    });
    const blob = new Blob(['\ufeff' + csv], {type: 'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `选股历史_${new Date().toISOString().split('T')[0]}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('导出成功');
}

async function clearHistory() {
    if (!(await appConfirm('清空历史', '确定清空所有选股历史吗？此操作不可恢复。', true))) return;
    history = [];
    localStorage.removeItem(STORAGE_KEY);
    renderAll();
    showToast('历史已清空');
}

function renderAll() {
    renderStats();
    renderTrendChart();
    renderFreqChart();
    renderHistory();
}

loadHistory();
renderAll();
window.addEventListener('resize', () => { renderTrendChart(); renderFreqChart(); });
</script>

<script>
var __adRes = null, __adMax = 0;
function appDialog(opt) {
  return new Promise(function (resolve) {
    __adRes = resolve;
    document.getElementById('adTitle').textContent = opt.title || '';
    document.getElementById('adMsg').textContent = opt.msg || '';
    var inp = document.getElementById('adInput');
    var q = document.getElementById('adQuick');
    __adMax = opt.max || 0;
    inp.style.display = opt.input ? 'block' : 'none';
    inp.value = opt.value || '';
    q.style.display = (opt.input && opt.quick) ? 'flex' : 'none';
    var ok = document.getElementById('adOkBtn');
    ok.textContent = opt.okText || '确定';
    ok.style.background = opt.danger ? '#e5484d' : '';
    document.getElementById('adOverlay').classList.add('show');
    document.getElementById('adSheet').classList.add('show');
  });
}
function __adQuick(ratio) {
  var inp = document.getElementById('adInput');
  if (__adMax) inp.value = String(Math.floor(__adMax * ratio));
}
function __adClose(ok) {
  var inp = document.getElementById('adInput');
  var isInput = inp.style.display !== 'none';
  document.getElementById('adOverlay').classList.remove('show');
  document.getElementById('adSheet').classList.remove('show');
  var r = __adRes; __adRes = null;
  if (r) r({ ok: ok, value: isInput ? inp.value : null });
}
function appConfirm(title, msg, danger) {
  return appDialog({ title: title, msg: msg, danger: danger })
    .then(function (r) { return !!r.ok; });
}
</script>

(function (global) {

  function NetworkError(message) {
    this.name = 'NetworkError';
    this.message = message;
  }
  NetworkError.prototype = Object.create(Error.prototype);

  function toastContainer() {
    var el = document.getElementById('toastContainer');
    if (el) return el;
    el = document.createElement('div');

  }

  function showToast(msg, type) {
    var container = toastContainer();
    var toast = document.createElement('div');
    toast.className = 'toast ' + (type || 'success');
    toast.textContent = String(msg);
    toast.style.cssText = 'background:#182231;color:#e6edf6;border:1px solid #2b3a4d;border-radius:6px;padding:9px 14px;font-size:13px;max-width:82vw;box-shadow:none';

  }

  var wrapBusy = false;
  function wrapTables() {
    if (wrapBusy || window.innerWidth > 768) return;
    wrapBusy = true;
    try {
      var tables = document.querySelectorAll('table');
      for (var i = 0; i < tables.length; i++) {
        var t = tables[i];
        if (!t.parentNode || t.parentNode.classList.contains('m-table-scroll')) continue;
        var w = document.createElement('div');
        w.className = 'm-table-scroll';
        w.style.cssText = 'overflow-x:auto;-webkit-overflow-scrolling:touch';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      }
    } finally {
      wrapBusy = false;
    }
  }

  function get(key, fallback) {
    try {
      var raw = global.localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  function set(key, value) {
    try {
      global.localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }

  function fetchJSON(url, options) {
    options = options || {};
    var timeout = options.timeout || 8000;
    var retries = options.retries === undefined ? 1 : options.retries;
    var attempt = 0;
    function once() {
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, timeout) : null;
      var init = Object.assign({}, options.init || {});
      if (ctrl) init.signal = ctrl.signal;
      return global.fetch(url, init).then(function (resp) {
        if (timer) clearTimeout(timer);
        if (!resp.ok) throw new NetworkError(url + ' HTTP ' + resp.status);
        return resp.json();
      }).catch(function (err) {
        if (timer) clearTimeout(timer);
        if (attempt++ < retries) return once();
        throw new NetworkError(url + ' ' + (err && err.message ? err.message : '请求失败'));
      });
    }
    return once();
  }

  function reportFailure(area, err, fallbackText) {
    var msg = (area || '数据') + '不可用：' + (err && err.message ? err.message : String(err));
    showToast(msg, 'error');
    if (fallbackText) showToast(fallbackText, 'info');
    return null;
  }

  function calcTechScore(count) {
    return Math.min(100, 30 + Math.max(0, Number(count) || 0) * 10);
  }

  function formatPct(value) {
    var n = Number(value);
    if (!isFinite(n)) return '--';
    return (n > 0 ? '+' : '') + n.toFixed(2) + '%';
  }

  function compareVersions(a, b) {
    function parts(v) {
      return String(v == null ? '' : v).replace(/^v/i, '').split(/[.\-]/)
        .map(function (x) { var n = parseInt(x, 10); return isFinite(n) ? n : 0; });
    }
    var pa = parts(a), pb = parts(b);
    var len = Math.max(pa.length, pb.length);
    for (var i = 0; i < len; i++) {
      var x = pa[i] || 0, y = pb[i] || 0;
      if (x > y) return 1;
      if (x < y) return -1;
    }
    return 0;
  }

  function updateURL() {
    return 'https://moseslee-commits.github.io/astock-pwa/version.js';

  function checkUpdate(options) {
    options = options || {};
    var local = options.localVersion;
    if (!local) {
      var badge = document.querySelector('.header-badge');
      local = (badge && badge.textContent || '').replace(/^v/i, '').trim();
    }
    if (!local && options.useAppVersion && global.APP_VERSION) local = global.APP_VERSION;
    var url = options.url || updateURL();
    var script = document.createElement('script');
    var settled = false;
    var timer = setTimeout(function () { finish(new Error('版本检查超时')); }, options.timeout || 6000);

    function finish(err) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      if (script.parentNode) script.parentNode.removeChild(script);
      var release = global.ASTOCK_RELEASE;
      if (err) {
        if (options.onError) options.onError(err);
        return;
      }
      if (!release || !release.version) {
        if (options.onError) options.onError(new Error('版本清单无效'));
        return;
      }
      if (options.onRelease) options.onRelease(release);
      if (compareVersions(release.version, local) > 0) {
        if (options.onUpdate) options.onUpdate(release, local);
      } else if (options.onCurrent) {
        options.onCurrent(release, local);
      }
    }

    global.ASTOCK_RELEASE = undefined;
    script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
    script.onload = function () { finish(); };
    script.onerror = function () { finish(new Error('版本清单加载失败')); };
    (document.head || document.body).appendChild(script);
  }

  function showUpdateBanner(release, options) {
    options = options || {};
    var id = 'ast-update-banner';
    var old = document.getElementById(id);
    if (old && old.parentNode) old.parentNode.removeChild(old);

    close.textContent = '×';
    close.setAttribute('aria-label', '关闭更新提示');
    close.style.cssText = 'flex:none;background:transparent;color:#94a3b8;border:0;font-size:18px;line-height:1;cursor:pointer';

    box.appendChild(btn);

  function registerServiceWorker(options) {

  function initUpdateChecks() {

    if (isApp) {
      checkUpdate({
        localVersion: global.APP_VERSION,
        useAppVersion: true,
        onUpdate: function (release) { showUpdateBanner(release); },

        showToast('发现新版本，点击刷新后生效', 'info');
        if (global.confirm && confirm('发现新版本，是否立即刷新？')) global.location.reload();
      }
    });
  }

  var memoStore = {};
  function memo(key, ttl, loader) {
    var hit = memoStore[key];
    var now = Date.now();
    if (hit && now - hit.time < ttl) return Promise.resolve(hit.value);
    return Promise.resolve().then(loader).then(function (value) {
      memoStore[key] = { time: Date.now(), value: value };
      return value;
    });
  }

  function clearMemo() { memoStore = {}; }

  function batchRun(items, worker, options) {
    options = options || {};
    var size = options.size || 5;
    var delay = options.delay || 0;
    var results = [];
    var index = 0;
    function next() {
      if (index >= items.length) return Promise.resolve(results);
      var batch = items.slice(index, index + size);
      index += size;
      return Promise.all(batch.map(function (item, i) {
        return Promise.resolve().then(function () { return worker(item, i); })
          .catch(function (e) { return { error: e && e.message ? e.message : String(e) }; });
      })).then(function (values) {
        results = results.concat(values);
        if (options.onProgress) options.onProgress(results.length, items.length);
        if (delay && index < items.length) {
          return new Promise(function (resolve) { setTimeout(resolve, delay); });
        }
      }).then(next);
    }
    return next();
  }

  global.wrapTables = wrapTables;
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initUpdateChecks);
  } else {
    initUpdateChecks();
  }
})(window);
